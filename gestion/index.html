<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de gestión | Franco Vinzón Odontólogo</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/isologo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1E3A5F; --navy-soft: #3E5A80; --gold: #D4A24C;
    --cream: #FAF9F6; --line: #E9E4D8; --white: #FFFFFF;
    --text: #2A2A2A; --muted: #8A8578;
    --turno: #1E3A5F; --sobreturno: #D4A24C; --bloqueo: #C1443A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--cream); color: var(--text); font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; }
  h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; color: var(--navy); margin: 0; }
  .hidden { display: none !important; }
  button { font-family: inherit; cursor: pointer; }
  input, select { font-family: inherit; font-size: 14px; }

  /* Login */
  #login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-box { background: var(--white); border-radius: 20px; padding: 32px 28px; max-width: 320px; width: 100%; box-shadow: 0 10px 40px rgba(30,58,95,.12); text-align: center; }
  .login-box img { height: 40px; margin-bottom: 18px; }
  .login-box h1 { font-size: 20px; margin-bottom: 18px; }
  .login-box input { width: 100%; padding: 11px 14px; border: 1.5px solid var(--line); border-radius: 10px; margin-bottom: 12px; }
  .login-box input:focus { outline: none; border-color: var(--gold); }
  .login-box button { width: 100%; background: var(--navy); color: var(--white); border: none; padding: 11px; border-radius: 10px; font-weight: 600; }
  .login-error { color: var(--bloqueo); font-size: 12.5px; margin-top: 10px; min-height: 16px; }

  /* App shell */
  #app { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }
  .main-content { min-width: 0; }
  .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .topbar img { width: 210px; max-width: 55vw; height: auto; }

  .search-mobile { background: var(--white); border-radius: 14px; padding: 8px; margin-bottom: 14px; box-shadow: 0 1px 8px rgba(30,58,95,.06); }
  .search-mobile input { width: 100%; border: none; background: transparent; padding: 6px 8px; font-size: 14px; color: var(--text); }
  .search-mobile input:focus { outline: none; }
  @media (min-width: 1000px) {
    .search-mobile { display: none; }
  }
  .logout-btn { margin-left: auto; background: none; border: none; color: var(--muted); font-size: 12px; text-decoration: underline; }

  .sidebar { display: none; }

  @media (min-width: 1000px) {
    #app { max-width: 1260px; display: flex; align-items: flex-start; gap: 40px; padding: 40px 32px 60px; }
    .main-content { flex: 1; }
    .topbar { display: none; }
    .sidebar {
      display: flex;
      flex-direction: column;
      width: 340px;
      flex-shrink: 0;
      background: var(--white);
      border-radius: 18px;
      padding: 36px 30px;
      box-shadow: 0 1px 8px rgba(30,58,95,.06);
      position: sticky;
      top: 40px;
    }
    /* Solo se fija el ancho; el alto queda en "auto" para que escale
       proporcional al archivo real (1779x514) y no se deforme. */
    .sidebar img { width: 260px; height: auto; margin-bottom: 24px; align-self: flex-start; }
    .sidebar h1 { font-size: 23px; margin-bottom: 5px; }
    .sidebar p { color: var(--muted); font-size: 13.5px; text-transform: capitalize; margin-bottom: 20px; }
    .sidebar-logout { margin-left: 0; margin-top: auto; text-align: left; padding-top: 18px; font-size: 13px; }
  }

  .sidebar-summary { display: flex; flex-direction: column; gap: 9px; padding: 15px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 18px; }
  .summary-line { font-size: 13.5px; color: var(--text); line-height: 1.4; }
  .summary-line strong { color: var(--navy); font-weight: 700; }
  .sidebar-search { margin-bottom: 4px; }
  .sidebar-search input { width: 100%; padding: 10px 13px; border: 1.5px solid var(--line); border-radius: 9px; background: var(--cream); font-size: 13.5px; }
  .sidebar-search input:focus { outline: none; border-color: var(--gold); background: var(--white); }

  .viewbar { display: flex; gap: 6px; margin-bottom: 14px; }
  .view-btn { flex: 1; padding: 9px; border-radius: 9px; border: 1.5px solid var(--navy); background: var(--white); color: var(--navy); font-size: 13px; font-weight: 600; }
  .view-btn.active { background: var(--navy); color: var(--white); }

  .week-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .week-day-card { display: flex; align-items: center; gap: 12px; background: var(--white); border-radius: 12px; padding: 12px 14px; box-shadow: 0 1px 8px rgba(30,58,95,.06); text-align: left; border: none; cursor: pointer; width: 100%; }
  .week-day-card.is-today { box-shadow: 0 1px 8px rgba(30,58,95,.06), inset 0 0 0 2px var(--gold); }
  .week-day-card .wd-date { width: 92px; flex-shrink: 0; }
  .week-day-card .wd-weekday { font-size: 10.5px; text-transform: uppercase; color: var(--muted); font-weight: 700; letter-spacing: .3px; }
  .week-day-card .wd-daynum { font-family: 'Fraunces', Georgia, serif; font-size: 17px; color: var(--navy); font-weight: 600; }
  .week-day-card .wd-info { flex: 1; font-size: 12.5px; color: var(--text); }
  .week-day-card .wd-badge { font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 3px 8px; border-radius: 100px; color: var(--white); background: var(--bloqueo); flex-shrink: 0; }

  .search-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .search-header h2 { font-size: 15px; flex: 1; }
  .search-back { background: none; border: none; color: var(--navy); font-size: 12.5px; font-weight: 600; text-decoration: underline; }
  .row .fecha { font-weight: 700; color: var(--navy); width: 76px; flex-shrink: 0; font-size: 12px; line-height: 1.3; }

  .datebar { display: flex; align-items: center; gap: 8px; background: var(--white); border-radius: 14px; padding: 8px; margin-bottom: 14px; box-shadow: 0 1px 8px rgba(30,58,95,.06); }
  .nav-btn { width: 32px; height: 32px; border-radius: 8px; border: none; background: var(--cream); color: var(--navy); font-size: 15px; flex-shrink: 0; }
  .today-btn { border-radius: 8px; border: none; background: var(--cream); color: var(--navy); font-size: 12.5px; font-weight: 700; padding: 0 14px; height: 34px; flex-shrink: 0; }
  .today-btn:disabled { opacity: .4; cursor: default; }
  #date-input { flex: 1; border: none; background: transparent; font-weight: 600; color: var(--navy); text-align: center; padding: 6px; }
  #date-input:focus { outline: none; }

  .mc-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .mc-month-label { font-weight: 700; font-size: 13.5px; color: var(--navy); text-transform: capitalize; }
  .mc-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 10px; color: var(--muted); font-weight: 700; margin-bottom: 4px; text-transform: uppercase; }
  .mc-grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 4px; margin-bottom: 12px; }
  .mc-cell { display: flex; align-items: center; justify-content: center; }
  .mc-day { width: 26px; height: 26px; border-radius: 50%; border: none; background: transparent; font-family: 'Inter', sans-serif; font-size: 11.5px; font-weight: 600; color: var(--line); }
  .mc-day.available { background: var(--navy); color: var(--white); cursor: pointer; }
  .mc-day.selected { box-shadow: inset 0 0 0 2px var(--gold); }
  .empty-day { color: var(--muted); font-size: 12.5px; }
  .slots-title { font-size: 12px; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
  .slots { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
  .slot-btn { padding: 7px 13px; border: 1.5px solid var(--navy-soft); border-radius: 100px; background: var(--white); color: var(--navy); font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 600; }
  .slot-btn.selected { background: var(--navy); border-color: var(--navy); color: var(--white); }

  .ahora-row { padding: 7px 14px; }
  .ahora-line { display: flex; align-items: center; gap: 7px; font-size: 10.5px; font-weight: 700; color: var(--bloqueo); text-transform: uppercase; letter-spacing: .3px; }
  .ahora-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--bloqueo); flex-shrink: 0; }
  .ahora-line::after { content: ''; flex: 1; height: 1px; background: var(--bloqueo); opacity: .3; }

  .actions-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .action-btn { padding: 9px 15px; border-radius: 9px; border: 1.5px solid var(--navy); background: var(--white); color: var(--navy); font-size: 13px; font-weight: 600; }
  .action-btn.primary { background: var(--navy); color: var(--white); }
  .action-btn.gold { border-color: var(--gold); color: var(--gold); }
  .action-btn.danger { border-color: var(--bloqueo); color: var(--bloqueo); }

  .agenda { background: var(--white); border-radius: 14px; box-shadow: 0 1px 8px rgba(30,58,95,.06); overflow: hidden; margin-bottom: 16px; }
  .agenda-empty { padding: 30px 16px; text-align: center; color: var(--muted); font-size: 13px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: none; }
  .row.row-nuevo { flex-wrap: wrap; background: rgba(212,162,76,.07); }
  .row .hora { font-weight: 700; color: var(--navy); width: 46px; flex-shrink: 0; font-size: 13px; }
  .row .info { flex: 1; min-width: 0; }
  .row .nombre { font-weight: 600; font-size: 13.5px; }
  .row .detalle { color: var(--muted); font-size: 13px; font-weight: 500; }
  .row .detalle-telefono { color: var(--navy); font-size: 16px; font-weight: 700; margin-top: 2px; letter-spacing: .2px; }
  .badge { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; padding: 3px 8px; border-radius: 100px; flex-shrink: 0; color: var(--white); }
  .badge.turno { background: var(--turno); }
  .badge.sobreturno { background: var(--sobreturno); }
  .badge.bloqueo { background: var(--bloqueo); }
  .badge-nuevo {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px;
    padding: 3px 9px; border-radius: 100px; flex-shrink: 0; color: #4a3208;
    background: linear-gradient(135deg, #FFE9B3, var(--gold));
    box-shadow: 0 0 0 1px rgba(212,162,76,.5), 0 2px 8px rgba(212,162,76,.55);
  }
  .row-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
  .add-tel-btn { padding: 5px 10px; border-radius: 100px; border: 1.5px solid var(--navy); background: var(--white); color: var(--navy); font-size: 10.5px; font-weight: 700; white-space: nowrap; }
  .inline-tel-input { width: 110px; padding: 5px 8px; border: 1.5px solid var(--line); border-radius: 8px; font-size: 12px; background: var(--cream); }
  .inline-tel-input:focus { outline: none; border-color: var(--gold); background: var(--white); }
  .icon-btn { width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--line); background: var(--white); color: var(--navy); font-size: 12px; display: flex; align-items: center; justify-content: center; text-decoration: none; }
  .icon-btn.trash { color: var(--bloqueo); border-color: rgba(193,68,55,.3); }
  .icon-btn.wa-btn { background: #25D366; border-color: #25D366; color: var(--white); }

  .panel { background: var(--white); border-radius: 14px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 8px rgba(30,58,95,.06); }
  .panel h2 { font-size: 15px; margin-bottom: 12px; }
  .field-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .field { position: relative; flex: 1; min-width: 130px; margin-bottom: 10px; }
  .autocomplete-dropdown {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 50;
    background: var(--white); border: 1.5px solid var(--line); border-radius: 10px;
    margin-top: 4px; box-shadow: 0 8px 24px rgba(30,58,95,.15);
    max-height: 220px; overflow-y: auto;
  }
  .autocomplete-item { padding: 9px 12px; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .autocomplete-item:last-child { border-bottom: none; }
  .autocomplete-item:hover { background: var(--cream); }
  .field label { display: block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; letter-spacing: .3px; }
  .field input, .field textarea { width: 100%; padding: 9px 11px; border: 1.5px solid var(--line); border-radius: 9px; background: var(--cream); }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--gold); background: var(--white); }
  .panel-actions { display: flex; gap: 8px; margin-top: 6px; }
  .panel-actions button { padding: 9px 18px; border-radius: 9px; font-weight: 600; font-size: 13px; border: none; }
  .btn-confirm { background: var(--gold); color: var(--white); }
  .btn-cancel { background: var(--cream); color: var(--navy); }
  .panel-msg { margin-top: 10px; font-size: 12.5px; font-weight: 600; }
  .panel-msg.error { color: var(--bloqueo); }
  .panel-msg.ok { color: #1a8f4c; }

  .loading-note { text-align: center; color: var(--muted); font-size: 13px; padding: 20px 0; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <img src="../assets/isologo.png" alt="">
    <h1>Panel de gestión</h1>
    <input type="password" id="key-input" placeholder="Clave de acceso" autocomplete="off">
    <button id="login-btn">Entrar</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div id="app" class="hidden">

  <aside class="sidebar">
    <img src="../assets/logo-horizontal.png" alt="Franco Vinzón Odontólogo">
    <h1 id="sidebar-greeting">Hola, Ayelen</h1>
    <p id="sidebar-date"></p>

    <div class="sidebar-summary" id="sidebar-summary">
      <div class="summary-line"><strong id="sum-turnos">–</strong> turnos hoy</div>
      <div class="summary-line"><strong id="sum-huecos">–</strong> huecos libres hoy</div>
      <div class="summary-line hidden" id="sum-bloqueo-line">Próximo día bloqueado: <strong id="sum-bloqueo-fecha"></strong></div>
    </div>

    <div class="sidebar-search">
      <input type="text" id="search-input" placeholder="Buscar paciente...">
    </div>

    <button class="logout-btn sidebar-logout" id="logout-btn-desktop">Salir</button>
  </aside>

  <div class="main-content">

  <div class="topbar">
    <img src="../assets/logo-horizontal.png" alt="Franco Vinzón Odontólogo">
    <button class="logout-btn" id="logout-btn">Salir</button>
  </div>

  <div class="search-mobile">
    <input type="text" id="search-input-mobile" placeholder="Buscar paciente...">
  </div>

  <div class="datebar">
    <button class="nav-btn" id="prev-day">‹</button>
    <input type="date" id="date-input">
    <button class="nav-btn" id="next-day">›</button>
    <button class="today-btn" id="today-btn">Hoy</button>
  </div>

  <div class="viewbar">
    <button class="view-btn active" id="view-dia-btn">Día</button>
    <button class="view-btn" id="view-semana-btn">Semana</button>
  </div>

  <div class="actions-row" id="actions-row">
    <button class="action-btn primary" id="btn-nuevo-turno">+ Nuevo turno</button>
    <button class="action-btn gold" id="btn-nuevo-sobreturno">+ Nuevo sobreturno</button>
    <button class="action-btn" id="btn-toggle-bloqueo-dia">Bloquear un día completo</button>
    <button class="action-btn danger" id="btn-bloquear-horario">Bloquear un horario</button>
  </div>

  <div id="panel-turno-calendario" class="panel hidden">
    <h2 id="mc-title">Nuevo turno</h2>
    <div class="mc-header">
      <button class="nav-btn" id="mc-prev">‹</button>
      <div class="mc-month-label" id="mc-month-label"></div>
      <button class="nav-btn" id="mc-next">›</button>
    </div>
    <div class="mc-weekdays"><span>D</span><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span></div>
    <div id="mc-days"></div>

    <div id="mc-slots-wrap" class="hidden">
      <div class="slots-title" id="mc-slots-title"></div>
      <div class="slots" id="mc-slots"></div>
    </div>

    <div id="mc-form-wrap" class="hidden">
      <div id="mc-datos-paciente">
        <div class="field-row">
          <div class="field"><label>Nombre</label><input type="text" id="mc-nombre" autocomplete="off"><div class="autocomplete-dropdown hidden" id="mc-nombre-dropdown"></div></div>
          <div class="field"><label>Apellido</label><input type="text" id="mc-apellido"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Teléfono</label><input type="text" id="mc-telefono"></div>
        </div>
      </div>
      <div class="field"><label>Motivo</label><input type="text" id="mc-motivo"></div>
    </div>

    <div class="panel-actions">
      <button class="btn-confirm" id="mc-confirm">Guardar</button>
      <button class="btn-cancel" id="mc-cancel">Cancelar</button>
    </div>
    <div class="panel-msg hidden" id="mc-msg"></div>
  </div>

  <div id="panel-turno" class="panel hidden">
    <h2>Nuevo sobreturno</h2>
    <div class="field-row">
      <div class="field"><label>Nombre</label><input type="text" id="t-nombre" autocomplete="off"><div class="autocomplete-dropdown hidden" id="t-nombre-dropdown"></div></div>
      <div class="field"><label>Apellido</label><input type="text" id="t-apellido"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Hora</label><input type="time" id="t-hora" step="900"></div>
      <div class="field"><label>Teléfono</label><input type="text" id="t-telefono"></div>
    </div>
    <div class="field"><label>Motivo</label><input type="text" id="t-motivo"></div>
    <div class="panel-actions">
      <button class="btn-confirm" id="t-confirm">Guardar</button>
      <button class="btn-cancel" id="t-cancel">Cancelar</button>
    </div>
    <div class="panel-msg hidden" id="t-msg"></div>
  </div>

  <div id="panel-horario" class="panel hidden">
    <div id="h-form-wrap">
      <h2>Bloquear un horario</h2>
      <div class="field"><label>Día</label><input type="date" id="h-fecha"></div>
      <div class="field-row">
        <div class="field"><label>Desde</label><input type="time" id="h-inicio" step="900"></div>
        <div class="field"><label>Hasta</label><input type="time" id="h-fin" step="900"></div>
      </div>
      <div class="field"><label>Motivo (opcional)</label><input type="text" id="h-motivo"></div>
      <div class="panel-actions">
        <button class="btn-confirm" id="h-confirm">Bloquear</button>
        <button class="btn-cancel" id="h-cancel">Cancelar</button>
      </div>
      <div class="panel-msg hidden" id="h-msg"></div>
    </div>
    <div id="h-success-wrap" class="hidden">
      <h2>Horario bloqueado</h2>
      <p class="empty-day" id="h-success-text" style="margin-bottom: 14px;"></p>
      <div class="panel-actions">
        <button class="btn-confirm" id="h-goto">Ir a ese día</button>
        <button class="btn-cancel" id="h-done">Listo</button>
      </div>
    </div>
  </div>

  <div id="panel-mover" class="panel hidden">
    <h2>Mover</h2>
    <div class="field-row">
      <div class="field"><label>Nueva fecha</label><input type="date" id="m-fecha"></div>
      <div class="field"><label>Nueva hora</label><input type="time" id="m-hora" step="900"></div>
    </div>
    <div class="field"><label>Motivo</label><input type="text" id="m-motivo"></div>
    <div class="panel-actions">
      <button class="btn-confirm" id="m-confirm">Mover</button>
      <button class="btn-cancel" id="m-cancel">Cancelar</button>
    </div>
    <div class="panel-msg hidden" id="m-msg"></div>
  </div>

  <div id="panel-bloqueo-dia" class="panel hidden">
    <div id="b-form-wrap">
      <h2>Bloquear un día completo</h2>
      <div class="field"><label>Día</label><input type="date" id="b-fecha"></div>
      <div class="field"><label>Motivo (opcional)</label><input type="text" id="b-motivo"></div>
      <div class="panel-actions">
        <button class="btn-confirm" id="b-confirm">Bloquear</button>
        <button class="btn-cancel" id="b-cancel">Cancelar</button>
      </div>
      <div class="panel-msg hidden" id="b-msg"></div>
    </div>
    <div id="b-success-wrap" class="hidden">
      <h2>Día bloqueado</h2>
      <p class="empty-day" id="b-success-text" style="margin-bottom: 14px;"></p>
      <div class="panel-actions">
        <button class="btn-confirm" id="b-goto">Ir a ese día</button>
        <button class="btn-cancel" id="b-done">Listo</button>
      </div>
    </div>
  </div>

  <div class="week-grid hidden" id="week-view"></div>

  <div id="search-results" class="hidden">
    <div class="search-header">
      <h2 id="search-title">Resultados</h2>
      <button class="search-back" id="search-back">Volver a la agenda</button>
    </div>
    <div class="agenda" id="search-agenda"></div>
  </div>

  <div class="agenda" id="agenda"></div>

  </div>
</div>

<script>
(function () {
  const TIME_ZONE = 'America/Argentina/Buenos_Aires';
  const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const pad2 = (n) => (n < 10 ? '0' + n : '' + n);
  // "Hoy" siempre en hora Argentina, sin importar la zona horaria del dispositivo de quien usa el panel.
  const todayStr = () => new Intl.DateTimeFormat('en-CA', {
    timeZone: TIME_ZONE, year: 'numeric', month: '2-digit', day: '2-digit',
  }).format(new Date());
  const fmtHora = (iso) => new Intl.DateTimeFormat('es-AR', { timeZone: TIME_ZONE, hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(iso));

  const DIAS_SEMANA = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

  let gestionKey = sessionStorage.getItem('gestionKey') || '';
  let currentDate = todayStr();
  let agendaItems = [];
  let moverContext = null; // { eventId, calendarId }
  let currentView = 'dia'; // 'dia' | 'semana' | 'busqueda'
  let searchResults = [];
  let searchQuery = '';

  const loginScreen = document.getElementById('login-screen');
  const appEl = document.getElementById('app');
  const keyInput = document.getElementById('key-input');
  const loginBtn = document.getElementById('login-btn');
  const loginError = document.getElementById('login-error');
  const dateInput = document.getElementById('date-input');
  const agendaEl = document.getElementById('agenda');
  const btnToggleBloqueoDia = document.getElementById('btn-toggle-bloqueo-dia');
  const datebarEl = document.querySelector('.datebar');
  const viewbarEl = document.querySelector('.viewbar');
  const actionsRowEl = document.getElementById('actions-row');
  const weekViewEl = document.getElementById('week-view');
  const searchResultsEl = document.getElementById('search-results');
  const searchAgendaEl = document.getElementById('search-agenda');
  const searchInput = document.getElementById('search-input');
  const viewDiaBtn = document.getElementById('view-dia-btn');
  const viewSemanaBtn = document.getElementById('view-semana-btn');

  const panelTurno = document.getElementById('panel-turno');
  const panelTurnoCalendario = document.getElementById('panel-turno-calendario');
  const panelHorario = document.getElementById('panel-horario');
  const panelMover = document.getElementById('panel-mover');
  const panelBloqueoDia = document.getElementById('panel-bloqueo-dia');
  const todayBtn = document.getElementById('today-btn');

  function showOnly(panel) {
    [panelTurno, panelTurnoCalendario, panelHorario, panelMover, panelBloqueoDia].forEach((p) => p.classList.add('hidden'));
    if (panel) panel.classList.remove('hidden');
  }

  // ---------- Login ----------
  function tryLogin() {
    const k = keyInput.value.trim();
    if (!k) return;
    gestionKey = k;
    sessionStorage.setItem('gestionKey', k);
    loginError.textContent = '';
    verificarYArrancar();
  }
  loginBtn.addEventListener('click', tryLogin);
  keyInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryLogin(); });

  function logout() {
    sessionStorage.removeItem('gestionKey');
    gestionKey = '';
    appEl.classList.add('hidden');
    loginScreen.classList.remove('hidden');
    keyInput.value = '';
  }
  document.getElementById('logout-btn').addEventListener('click', logout);
  document.getElementById('logout-btn-desktop').addEventListener('click', logout);

  function onUnauthorized() {
    sessionStorage.removeItem('gestionKey');
    gestionKey = '';
    appEl.classList.add('hidden');
    loginScreen.classList.remove('hidden');
    loginError.textContent = 'Clave incorrecta.';
  }

  function verificarYArrancar() {
    if (!gestionKey) return;
    loginScreen.classList.add('hidden');
    appEl.classList.remove('hidden');
    dateInput.value = currentDate;
    updateTodayBtn();
    document.getElementById('sidebar-date').textContent =
      new Intl.DateTimeFormat('es-AR', { timeZone: TIME_ZONE, weekday: 'long', day: 'numeric', month: 'long' }).format(new Date());
    cargarAgenda();
    cargarResumenSidebar();
  }

  // ---------- Fecha ----------
  dateInput.addEventListener('change', () => {
    currentDate = dateInput.value;
    updateTodayBtn();
    if (currentView === 'semana') cargarSemana(); else cargarAgenda();
  });
  document.getElementById('prev-day').addEventListener('click', () => cambiarDia(currentView === 'semana' ? -7 : -1));
  document.getElementById('next-day').addEventListener('click', () => cambiarDia(currentView === 'semana' ? 7 : 1));
  todayBtn.addEventListener('click', () => {
    if (currentDate === todayStr()) return;
    currentDate = todayStr();
    dateInput.value = currentDate;
    updateTodayBtn();
    if (currentView === 'semana') cargarSemana(); else cargarAgenda();
  });

  function cambiarDia(delta) {
    const [y, m, d] = currentDate.split('-').map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d + delta));
    currentDate = `${dt.getUTCFullYear()}-${pad2(dt.getUTCMonth() + 1)}-${pad2(dt.getUTCDate())}`;
    dateInput.value = currentDate;
    updateTodayBtn();
    if (currentView === 'semana') cargarSemana(); else cargarAgenda();
  }

  function updateTodayBtn() {
    todayBtn.disabled = currentDate === todayStr();
  }

  // ---------- Resumen del sidebar ----------
  function cargarResumenSidebar() {
    const hoy = todayStr();
    Promise.all([
      fetch(`/api/gestion/turnos-dia?date=${hoy}&key=${encodeURIComponent(gestionKey)}`).then((r) => (r.ok ? r.json() : [])),
      fetch(`/api/horarios-dia?date=${hoy}`).then((r) => (r.ok ? r.json() : [])),
      fetch(`/api/gestion/proximo-bloqueo?key=${encodeURIComponent(gestionKey)}`).then((r) => (r.ok ? r.json() : { date: null })),
    ]).then(([turnosHoy, huecosHoy, proximoBloqueo]) => {
      const cantidadTurnos = (turnosHoy || []).filter((it) => it.tipo !== 'bloqueo').length;
      document.getElementById('sum-turnos').textContent = cantidadTurnos;
      document.getElementById('sum-huecos').textContent = (huecosHoy || []).length;

      const lineaBloqueo = document.getElementById('sum-bloqueo-line');
      if (proximoBloqueo && proximoBloqueo.date) {
        const [y, m, d] = proximoBloqueo.date.split('-').map(Number);
        document.getElementById('sum-bloqueo-fecha').textContent = `${d} de ${MESES[m - 1]}`;
        lineaBloqueo.classList.remove('hidden');
      } else {
        lineaBloqueo.classList.add('hidden');
      }
    }).catch(() => {});
  }

  // ---------- Vista Día / Semana / Búsqueda ----------
  function actualizarVisibilidadVista() {
    const buscando = currentView === 'busqueda';
    datebarEl.classList.toggle('hidden', buscando);
    viewbarEl.classList.toggle('hidden', buscando);
    actionsRowEl.classList.toggle('hidden', buscando || currentView === 'semana');
    searchResultsEl.classList.toggle('hidden', !buscando);
    weekViewEl.classList.toggle('hidden', currentView !== 'semana');
    agendaEl.classList.toggle('hidden', currentView !== 'dia');
  }

  function cambiarVista(view) {
    currentView = view;
    viewDiaBtn.classList.toggle('active', view === 'dia');
    viewSemanaBtn.classList.toggle('active', view === 'semana');
    actualizarVisibilidadVista();
    if (view === 'dia') cargarAgenda();
    else if (view === 'semana') cargarSemana();
  }
  viewDiaBtn.addEventListener('click', () => cambiarVista('dia'));
  viewSemanaBtn.addEventListener('click', () => cambiarVista('semana'));

  // ---------- Agenda (vista Día) ----------
  function cargarAgenda() {
    showOnly(null);
    agendaEl.innerHTML = '<div class="loading-note">Cargando agenda...</div>';
    fetch(`/api/gestion/turnos-dia?date=${currentDate}&key=${encodeURIComponent(gestionKey)}`)
      .then((r) => {
        if (r.status === 401) { onUnauthorized(); throw new Error('unauthorized'); }
        return r.json();
      })
      .then((data) => { agendaItems = data; renderAgenda(); cargarResumenSidebar(); })
      .catch((err) => {
        if (err.message !== 'unauthorized') agendaEl.innerHTML = '<div class="agenda-empty">No se pudo cargar la agenda.</div>';
      });
  }

  // ---------- Vista Semana ----------
  function getWeekDates(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    const dow = new Date(y, m - 1, d).getDay();
    const sundayUTC = Date.UTC(y, m - 1, d - dow);
    const dates = [];
    for (let i = 0; i < 7; i++) {
      const dt = new Date(sundayUTC + i * 24 * 60 * 60000);
      dates.push(`${dt.getUTCFullYear()}-${pad2(dt.getUTCMonth() + 1)}-${pad2(dt.getUTCDate())}`);
    }
    return dates;
  }

  function cargarSemana() {
    weekViewEl.innerHTML = '<div class="loading-note">Cargando semana...</div>';
    const dates = getWeekDates(currentDate);

    Promise.all(dates.map((fecha) =>
      fetch(`/api/gestion/turnos-dia?date=${fecha}&key=${encodeURIComponent(gestionKey)}`)
        .then((r) => {
          if (r.status === 401) { onUnauthorized(); throw new Error('unauthorized'); }
          return r.json();
        })
        .then((items) => ({ fecha, items }))
    )).then((resultados) => {
      renderSemana(resultados);
      cargarResumenSidebar();
    }).catch((err) => {
      if (err.message !== 'unauthorized') weekViewEl.innerHTML = '<div class="agenda-empty">No se pudo cargar la semana.</div>';
    });
  }

  function renderSemana(resultados) {
    const hoy = todayStr();

    weekViewEl.innerHTML = resultados.map(({ fecha, items }) => {
      const [y, m, d] = fecha.split('-').map(Number);
      const dow = new Date(y, m - 1, d).getDay();
      const turnos = items.filter((it) => it.tipo !== 'bloqueo').length;
      const bloqueoTotal = items.some((it) => it.tipo === 'bloqueo' && it.allDay);
      const bloqueoParcial = !bloqueoTotal && items.some((it) => it.tipo === 'bloqueo');
      const badge = bloqueoTotal ? '<span class="wd-badge">Bloqueado</span>' : bloqueoParcial ? '<span class="wd-badge">Bloqueo parcial</span>' : '';
      const isToday = fecha === hoy;
      const infoText = bloqueoTotal
        ? 'No atiende'
        : `${turnos} turno${turnos === 1 ? '' : 's'}${bloqueoParcial ? ' · con bloqueo parcial' : ''}`;

      return `
        <button type="button" class="week-day-card${isToday ? ' is-today' : ''}" data-fecha="${fecha}">
          <div class="wd-date">
            <div class="wd-weekday">${DIAS_SEMANA[dow]}</div>
            <div class="wd-daynum">${d} de ${MESES[m - 1]}</div>
          </div>
          <div class="wd-info">${infoText}</div>
          ${badge}
        </button>`;
    }).join('');

    weekViewEl.querySelectorAll('.week-day-card').forEach((btn) => {
      btn.addEventListener('click', () => {
        currentDate = btn.dataset.fecha;
        dateInput.value = currentDate;
        updateTodayBtn();
        cambiarVista('dia');
      });
    });
  }

  // ---------- Búsqueda de pacientes ----------
  const searchInputMobile = document.getElementById('search-input-mobile');
  let searchDebounce = null;

  function wireSearchInput(el) {
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter') ejecutarBusqueda(el.value.trim()); });
    el.addEventListener('input', () => {
      clearTimeout(searchDebounce);
      const q = el.value.trim();
      if (!q) return;
      searchDebounce = setTimeout(() => ejecutarBusqueda(q), 500);
    });
  }
  wireSearchInput(searchInput);
  wireSearchInput(searchInputMobile);

  document.getElementById('search-back').addEventListener('click', () => {
    searchInput.value = '';
    searchInputMobile.value = '';
    cambiarVista('dia');
  });

  function ejecutarBusqueda(q) {
    const query = (q !== undefined ? q : searchQuery).trim();
    if (!query) return;
    searchQuery = query;
    currentView = 'busqueda';
    actualizarVisibilidadVista();
    document.getElementById('search-title').textContent = `Resultados para "${query}"`;
    searchAgendaEl.innerHTML = '<div class="loading-note">Buscando...</div>';

    fetch(`/api/gestion/buscar?q=${encodeURIComponent(query)}&key=${encodeURIComponent(gestionKey)}`)
      .then((r) => {
        if (r.status === 401) { onUnauthorized(); throw new Error('unauthorized'); }
        return r.json();
      })
      .then((data) => { searchResults = data; renderSearchResults(); cargarResumenSidebar(); })
      .catch((err) => {
        if (err.message !== 'unauthorized') searchAgendaEl.innerHTML = '<div class="agenda-empty">No se pudo buscar.</div>';
      });
  }

  function renderSearchRow(it, idx) {
    const desc = extraerMotivo(it.description, it.tipo);
    const d = new Date(it.start);
    const fechaCorta = new Intl.DateTimeFormat('es-AR', { timeZone: TIME_ZONE, day: 'numeric', month: 'short' }).format(d);
    const fechaTxt = it.allDay ? fechaCorta : `${fechaCorta}<br>${fmtHora(it.start)}`;
    const badgeLabel = it.tipo === 'turno' ? 'Turno' : it.tipo === 'sobreturno' ? 'Sobreturno' : 'Bloqueado';
    const acciones = it.tipo === 'bloqueo'
      ? ''
      : `<div class="row-actions">
           <button class="icon-btn" data-action="mover" data-idx="${idx}" title="Mover">🔄</button>
           <button class="icon-btn trash" data-action="cancelar" data-idx="${idx}" title="Cancelar">🗑</button>
         </div>`;
    return `
      <div class="row">
        <div class="fecha">${fechaTxt}</div>
        <div class="info">
          <div class="nombre">${escapeHtml(it.title || '(sin título)')}</div>
          <div class="detalle">${escapeHtml(desc)}</div>
        </div>
        <span class="badge ${it.tipo}">${badgeLabel}</span>
        ${acciones}
      </div>`;
  }

  function renderSearchResults() {
    if (searchResults.length === 0) {
      searchAgendaEl.innerHTML = '<div class="agenda-empty">No se encontraron resultados.</div>';
      return;
    }

    searchAgendaEl.innerHTML = searchResults.map((it, idx) => renderSearchRow(it, idx)).join('');

    searchAgendaEl.querySelectorAll('[data-action]').forEach((btn) => {
      const item = searchResults[parseInt(btn.dataset.idx, 10)];
      btn.addEventListener('click', () => {
        if (btn.dataset.action === 'mover') {
          if (item.tipo === 'turno') abrirMoverTurnoCalendario(item);
          else abrirMover(item);
        } else {
          cancelarItem(item);
        }
      });
    });
  }

  function diaBloqueadoCompleto() {
    return agendaItems.find((it) => it.tipo === 'bloqueo' && it.allDay);
  }

  function extraerMotivo(description, tipo) {
    if (tipo === 'bloqueo') return '';
    const sinTags = (description || '').replace(/<[^>]*>/g, ' ');
    const match = sinTags.match(/Motivo\s*:?\s*\n?\s*([^\n]+)/i);
    const motivo = match ? match[1].replace(/<[^>]*>/g, '').trim() : '';
    return motivo || 'Sin motivo especificado';
  }

  const PREFIJOS_PAIS = ['54', '598', '595', '56', '55', '591', '51', '57', '52', '34', '1'];
  function normalizarTelefonoWhatsApp(raw) {
    let digitos = (raw || '').replace(/\D/g, '');
    if (!digitos) return null;
    const yaConCodigo = PREFIJOS_PAIS.some((p) => digitos.startsWith(p));
    if (!yaConCodigo) {
      if (digitos.startsWith('0')) digitos = digitos.slice(1);
      for (const largoArea of [4, 3, 2]) {
        if (digitos.slice(largoArea, largoArea + 2) === '15') {
          digitos = digitos.slice(0, largoArea) + digitos.slice(largoArea + 2);
          break;
        }
      }
      digitos = '549' + digitos;
    }
    if (digitos.length < 10 || digitos.length > 15) return null;
    return digitos;
  }

  function mensajeRecordatorio(it) {
    const fechaItem = new Intl.DateTimeFormat('en-CA', { timeZone: TIME_ZONE, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(it.start));
    const hoy = todayStr();
    const [hy, hm, hd] = hoy.split('-').map(Number);
    const mananaDt = new Date(Date.UTC(hy, hm - 1, hd + 1));
    const manana = `${mananaDt.getUTCFullYear()}-${pad2(mananaDt.getUTCMonth() + 1)}-${pad2(mananaDt.getUTCDate())}`;
    let cuando;
    if (fechaItem === hoy) cuando = 'hoy';
    else if (fechaItem === manana) cuando = 'mañana';
    else { const [, m, d] = fechaItem.split('-').map(Number); cuando = `el ${d} de ${MESES[m - 1]}`; }
    return `¡Hola! 😊🦷 Te escribimos para recordarte tu turno de ${cuando} a las ${fmtHora(it.start)}.`;
  }

  function armarLinkWhatsApp(telefonoRaw) {
    const normalizado = normalizarTelefonoWhatsApp(telefonoRaw);
    return normalizado ? `https://wa.me/${normalizado}` : null;
  }

  function renderRow(it, idx) {
    const desc = extraerMotivo(it.description, it.tipo);
    const hora = it.allDay ? 'Todo el día' : fmtHora(it.start);
    const badgeLabel = it.tipo === 'turno' ? 'Turno' : it.tipo === 'sobreturno' ? 'Sobreturno' : 'Bloqueado';
    const esNuevo = !!it.esNuevoPaciente;
    const waLinkBase = it.tipo !== 'bloqueo' ? armarLinkWhatsApp(it.telefono) : null;
    const waLink = waLinkBase ? `${waLinkBase}?text=${encodeURIComponent(mensajeRecordatorio(it))}` : null;

    const botones = [];
    if (waLink) {
      botones.push(`<a class="icon-btn wa-btn" href="${waLink}" target="_blank" rel="noopener" title="Escribir por WhatsApp"><svg viewBox="0 0 32 32" width="14" height="14" fill="currentColor"><path d="M16 2C8.3 2 2 8.3 2 16c0 2.6.7 5.1 2 7.3L2 30l6.9-1.8c2.1 1.2 4.6 1.8 7.1 1.8 7.7 0 14-6.3 14-14S23.7 2 16 2zm0 25.5c-2.3 0-4.5-.6-6.4-1.8l-.5-.3-4.1 1.1 1.1-4-.3-.5C4.6 20.2 4 18.1 4 16 4 9.4 9.4 4 16 4s12 5.4 12 12-5.4 11.5-12 11.5zm6.6-8.7c-.4-.2-2.1-1-2.4-1.2-.3-.1-.6-.2-.8.2-.2.4-.9 1.2-1.1 1.4-.2.2-.4.3-.8.1-.4-.2-1.6-.6-3-1.9-1.1-1-1.9-2.2-2.1-2.6-.2-.4 0-.6.2-.8.2-.2.4-.4.6-.7.2-.2.3-.4.4-.7.1-.3.1-.5 0-.7-.1-.2-.8-2-1.1-2.7-.3-.7-.6-.6-.8-.6h-.7c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8s1.2 3.3 1.4 3.5c.2.2 2.4 3.7 5.8 5.1.8.3 1.5.5 2 .7.8.3 1.6.2 2.1.1.7-.1 2.1-.9 2.4-1.7.3-.8.3-1.5.2-1.7-.1-.1-.3-.2-.7-.4z"/></svg></a>`);
      botones.push(`<button class="add-tel-btn" data-action="editar-tel" data-idx="${idx}" title="Editar teléfono">Editar tel.</button>`);
    } else if (it.tipo !== 'bloqueo') {
      botones.push(`<button class="add-tel-btn" data-action="agregar-tel" data-idx="${idx}">+ Agregar teléfono</button>`);
    }
    if (it.tipo !== 'bloqueo') {
      botones.push(`<button class="icon-btn" data-action="mover" data-idx="${idx}" title="Mover">🔄</button>`);
      botones.push(`<button class="icon-btn trash" data-action="cancelar" data-idx="${idx}" title="Cancelar">🗑</button>`);
    }
    const acciones = botones.length ? `<div class="row-actions">${botones.join('')}</div>` : '';

    const nuevoBadge = esNuevo ? '<span class="badge-nuevo">✨ Nuevo paciente</span>' : '';
    const telefonoLine = esNuevo && it.telefono ? `<div class="detalle-telefono">${escapeHtml(it.telefono)}</div>` : '';

    return `
      <div class="row${esNuevo ? ' row-nuevo' : ''}" data-row-idx="${idx}">
        <div class="hora">${hora}</div>
        <div class="info">
          <div class="nombre">${escapeHtml(it.title || '(sin título)')}</div>
          <div class="detalle">${escapeHtml(desc)}</div>
          ${telefonoLine}
        </div>
        <span class="badge ${it.tipo}">${badgeLabel}</span>
        ${nuevoBadge}
        ${acciones}
      </div>`;
  }

  function renderAhoraRow(now) {
    return `<div class="row ahora-row"><div class="ahora-line"><span class="ahora-dot"></span> Ahora · ${fmtHora(now)}</div></div>`;
  }

  function renderAgenda() {
    const bloqueoCompleto = diaBloqueadoCompleto();
    btnToggleBloqueoDia.textContent = bloqueoCompleto ? 'Desbloquear este día' : 'Bloquear un día completo';
    btnToggleBloqueoDia.classList.toggle('danger', !!bloqueoCompleto);

    const esHoy = currentDate === todayStr();

    if (agendaItems.length === 0 && !esHoy) {
      agendaEl.innerHTML = '<div class="agenda-empty">No hay turnos, sobreturnos ni bloqueos este día.</div>';
      return;
    }

    const rows = agendaItems.map((it, idx) => renderRow(it, idx));

    if (esHoy) {
      const now = new Date();
      let insertAt = agendaItems.findIndex((it) => new Date(it.start) > now);
      if (insertAt === -1) insertAt = rows.length;
      rows.splice(insertAt, 0, renderAhoraRow(now));
    }

    agendaEl.innerHTML = rows.join('');
  }

  // Delegación de eventos: un solo listener cubre botones ya renderizados
  // y los que se inyectan dinámicamente después (ej. "Guardar" del teléfono inline).
  agendaEl.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const idx = parseInt(btn.dataset.idx, 10);
    const item = agendaItems[idx];
    const action = btn.dataset.action;

    if (action === 'mover') {
      if (item.tipo === 'turno') abrirMoverTurnoCalendario(item);
      else abrirMover(item);
    } else if (action === 'cancelar') {
      cancelarItem(item);
    } else if (action === 'agregar-tel' || action === 'editar-tel') {
      abrirAgregarTelefonoInline(idx, action);
    } else if (action === 'guardar-tel') {
      guardarTelefonoInline(idx, item);
    }
  });

  function abrirAgregarTelefonoInline(idx, modo) {
    const item = agendaItems[idx];
    const actionsEl = agendaEl.querySelector(`.row[data-row-idx="${idx}"] .row-actions`);
    if (!actionsEl) return;
    actionsEl.innerHTML = `
      <input type="tel" class="inline-tel-input" id="inline-tel-${idx}" data-modo="${modo}" placeholder="Teléfono" value="${escapeHtml(item && item.telefono ? item.telefono : '')}">
      <button class="icon-btn" data-action="guardar-tel" data-idx="${idx}" title="Guardar">✓</button>
    `;
    const input = document.getElementById(`inline-tel-${idx}`);
    if (input) { input.focus(); input.select(); }
  }

  function guardarTelefonoInline(idx, item) {
    const input = document.getElementById(`inline-tel-${idx}`);
    const telefono = input ? input.value.trim() : '';
    const modo = input ? input.dataset.modo : 'agregar-tel';
    if (!telefono && modo !== 'editar-tel') {
      if (input) { input.style.borderColor = 'var(--bloqueo)'; input.placeholder = 'Obligatorio'; input.focus(); }
      return;
    }

    fetch('/api/gestion/agregar-telefono', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: gestionKey, eventId: item.id, calendarId: item.calendarId, telefono }),
    })
      .then((r) => { if (r.status === 401) { onUnauthorized(); throw new Error('unauthorized'); } return r.json(); })
      .then((res) => { if (res.success) cargarAgenda(); })
      .catch((err) => { if (err.message !== 'unauthorized') { /* no-op, se puede reintentar */ } });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---------- Nuevo sobreturno (hora libre, calendario de sobreturnos) ----------
  document.getElementById('btn-nuevo-sobreturno').addEventListener('click', abrirTurno);
  document.getElementById('t-cancel').addEventListener('click', () => showOnly(null));
  document.getElementById('t-confirm').addEventListener('click', confirmarTurno);

  function abrirTurno() {
    ['t-nombre', 't-apellido', 't-hora', 't-telefono', 't-motivo'].forEach((id) => document.getElementById(id).value = '');
    setMsg('t-msg', '', '');
    showOnly(panelTurno);
  }

  function confirmarTurno() {
    const nombre = document.getElementById('t-nombre').value.trim();
    const apellido = document.getElementById('t-apellido').value.trim();
    const hora = document.getElementById('t-hora').value;
    const telefono = document.getElementById('t-telefono').value.trim();
    const motivo = document.getElementById('t-motivo').value.trim();

    if (!nombre || !motivo || !hora || !telefono) {
      setMsg('t-msg', 'Completá nombre, teléfono, hora y motivo.', 'error');
      return;
    }

    setMsg('t-msg', 'Guardando...', '');
    fetch('/api/gestion/crear-turno', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: gestionKey, date: currentDate, time: hora, nombre, apellido, telefono, motivo, sobreturno: true }),
    })
      .then((r) => { if (r.status === 401) { onUnauthorized(); throw new Error('unauthorized'); } return r.json(); })
      .then((res) => {
        setMsg('t-msg', res.message, res.success ? 'ok' : 'error');
        if (res.success) { showOnly(null); cargarAgenda(); }
      })
      .catch((err) => { if (err.message !== 'unauthorized') setMsg('t-msg', 'Error de red.', 'error'); });
  }

  // ---------- Nuevo turno / Mover turno (calendario + horarios, igual que /turnos) ----------
  let mcYear, mcMonth, mcAvailability = {}, mcFecha = null, mcHora = null;
  let mcMode = 'crear'; // 'crear' | 'mover'
  let mcMoverContext = null; // { eventId, calendarId }

  document.getElementById('btn-nuevo-turno').addEventListener('click', abrirNuevoTurno);
  document.getElementById('mc-cancel').addEventListener('click', () => showOnly(null));
  document.getElementById('mc-prev').addEventListener('click', () => cambiarMesMC(-1));
  document.getElementById('mc-next').addEventListener('click', () => cambiarMesMC(1));
  document.getElementById('mc-confirm').addEventListener('click', confirmarMC);

  function abrirNuevoTurno() {
    mcMode = 'crear';
    mcMoverContext = null;
    const [y, m] = currentDate.split('-').map(Number);
    mcYear = y; mcMonth = m;
    mcFecha = null; mcHora = null;
    document.getElementById('mc-slots-wrap').classList.add('hidden');
    document.getElementById('mc-form-wrap').classList.add('hidden');
    document.getElementById('mc-datos-paciente').classList.remove('hidden');
    ['mc-nombre', 'mc-apellido', 'mc-telefono', 'mc-motivo'].forEach((id) => document.getElementById(id).value = '');
    document.getElementById('mc-title').textContent = 'Nuevo turno';
    document.getElementById('mc-confirm').textContent = 'Guardar';
    setMsg('mc-msg', '', '');
    showOnly(panelTurnoCalendario);
    cargarMesMC();
  }

  function abrirMoverTurnoCalendario(item) {
    mcMode = 'mover';
    mcMoverContext = { eventId: item.id, calendarId: item.calendarId };
    const fechaItem = new Intl.DateTimeFormat('en-CA', { timeZone: TIME_ZONE, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(item.start));
    const [y, m] = fechaItem.split('-').map(Number);
    mcYear = y; mcMonth = m;
    mcFecha = null; mcHora = null;
    document.getElementById('mc-slots-wrap').classList.add('hidden');
    document.getElementById('mc-form-wrap').classList.add('hidden');
    document.getElementById('mc-datos-paciente').classList.add('hidden');
    document.getElementById('mc-motivo').value = extraerMotivo(item.description, item.tipo);
    document.getElementById('mc-title').textContent = 'Mover turno';
    document.getElementById('mc-confirm').textContent = 'Mover';
    setMsg('mc-msg', '', '');
    showOnly(panelTurnoCalendario);
    cargarMesMC();
  }

  function cambiarMesMC(delta) {
    let m = mcMonth + delta, y = mcYear;
    if (m > 12) { m = 1; y++; }
    if (m < 1) { m = 12; y--; }
    mcYear = y; mcMonth = m;
    mcFecha = null; mcHora = null;
    document.getElementById('mc-slots-wrap').classList.add('hidden');
    document.getElementById('mc-form-wrap').classList.add('hidden');
    cargarMesMC();
  }

  function cargarMesMC() {
    document.getElementById('mc-month-label').textContent = MESES[mcMonth - 1] + ' ' + mcYear;
    document.getElementById('mc-days').innerHTML = '<div class="loading-note">Cargando...</div>';
    fetch(`/api/disponibilidad-mes?year=${mcYear}&month=${mcMonth}`)
      .then((r) => r.json())
      .then((data) => { mcAvailability = data; renderMCDays(); })
      .catch(() => { document.getElementById('mc-days').innerHTML = '<div class="loading-note">No se pudo cargar.</div>'; });
  }

  function renderMCDays() {
    const firstDow = new Date(mcYear, mcMonth - 1, 1).getDay();
    const daysInMonth = new Date(mcYear, mcMonth, 0).getDate();
    let html = '<div class="mc-grid">';
    for (let i = 0; i < firstDow; i++) html += '<div class="mc-cell"></div>';
    for (let d = 1; d <= daysInMonth; d++) {
      const isAvailable = !!mcAvailability[d];
      const dateStr = `${mcYear}-${pad2(mcMonth)}-${pad2(d)}`;
      const isSelected = mcFecha === dateStr;
      const cls = ['mc-day', isAvailable && 'available', isSelected && 'selected'].filter(Boolean).join(' ');
      html += `<div class="mc-cell"><button type="button" class="${cls}" data-day="${d}" ${isAvailable ? '' : 'disabled'}>${d}</button></div>`;
    }
    html += '</div>';
    document.getElementById('mc-days').innerHTML = html;
    document.querySelectorAll('#mc-days .mc-day.available').forEach((btn) => {
      btn.addEventListener('click', () => seleccionarDiaMC(parseInt(btn.dataset.day, 10)));
    });
  }

  function seleccionarDiaMC(dia) {
    mcFecha = `${mcYear}-${pad2(mcMonth)}-${pad2(dia)}`;
    mcHora = null;
    renderMCDays();
    document.getElementById('mc-form-wrap').classList.add('hidden');

    const wrap = document.getElementById('mc-slots-wrap');
    wrap.classList.remove('hidden');
    document.getElementById('mc-slots-title').textContent = `Horarios para el ${dia} de ${MESES[mcMonth - 1]}`;
    document.getElementById('mc-slots').innerHTML = '<span class="empty-day">Buscando horarios...</span>';

    fetch(`/api/horarios-dia?date=${mcFecha}`)
      .then((r) => r.json())
      .then((slots) => renderMCSlots(slots))
      .catch(() => { document.getElementById('mc-slots').innerHTML = '<span class="empty-day">No se pudieron cargar los horarios.</span>'; });
  }

  function renderMCSlots(slots) {
    const el = document.getElementById('mc-slots');
    if (!slots || slots.length === 0) {
      el.innerHTML = '<span class="empty-day">No quedan horarios libres este día.</span>';
      return;
    }
    el.innerHTML = slots.map((hora) =>
      `<button type="button" class="slot-btn${mcHora === hora ? ' selected' : ''}" data-hora="${hora}">${hora}</button>`
    ).join('');
    el.querySelectorAll('.slot-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        mcHora = btn.dataset.hora;
        renderMCSlots(slots);
        document.getElementById('mc-form-wrap').classList.remove('hidden');
      });
    });
  }

  function confirmarMC() {
    if (!mcFecha || !mcHora) {
      setMsg('mc-msg', 'Elegí un día y un horario.', 'error');
      return;
    }

    if (mcMode === 'mover') {
      const motivo = document.getElementById('mc-motivo').value.trim();
      setMsg('mc-msg', 'Moviendo...', '');
      fetch('/api/gestion/evento', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: gestionKey, accion: 'mover', eventId: mcMoverContext.eventId, calendarId: mcMoverContext.calendarId, nuevaFecha: mcFecha, nuevaHora: mcHora, motivo }),
      })
        .then((r) => { if (r.status === 401) { onUnauthorized(); throw new Error('unauthorized'); } return r.json(); })
        .then((res) => {
          setMsg('mc-msg', res.message, res.success ? 'ok' : 'error');
          if (res.success) {
            showOnly(null);
            if (currentView === 'busqueda') {
              ejecutarBusqueda();
            } else {
              currentDate = mcFecha;
              dateInput.value = currentDate;
              updateTodayBtn();
              cargarAgenda();
            }
          }
        })
        .catch((err) => { if (err.message !== 'unauthorized') setMsg('mc-msg', 'Error de red.', 'error'); });
      return;
    }

    const nombre = document.getElementById('mc-nombre').value.trim();
    const apellido = document.getElementById('mc-apellido').value.trim();
    const telefono = document.getElementById('mc-telefono').value.trim();
    const motivo = document.getElementById('mc-motivo').value.trim();

    if (!nombre || !motivo || !telefono) {
      setMsg('mc-msg', 'Completá nombre, teléfono y motivo.', 'error');
      return;
    }

    setMsg('mc-msg', 'Guardando...', '');
    fetch('/api/gestion/crear-turno', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: gestionKey, date: mcFecha, time: mcHora, nombre, apellido, telefono, motivo, sobreturno: false }),
    })
      .then((r) => { if (r.status === 401) { onUnauthorized(); throw new Error('unauthorized'); } return r.json(); })
      .then((res) => {
        setMsg('mc-msg', res.message, res.success ? 'ok' : 'error');
        if (res.success) {
          showOnly(null);
          currentDate = mcFecha;
          dateInput.value = currentDate;
          updateTodayBtn();
          cargarAgenda();
        }
      })
      .catch((err) => { if (err.message !== 'unauthorized') setMsg('mc-msg', 'Error de red.', 'error'); });
  }

  // ---------- Bloquear horario ----------
  let hFechaBloqueada = null;

  document.getElementById('btn-bloquear-horario').addEventListener('click', () => {
    document.getElementById('h-fecha').value = currentDate;
    ['h-inicio', 'h-fin', 'h-motivo'].forEach((id) => document.getElementById(id).value = '');
    setMsg('h-msg', '', '');
    document.getElementById('h-form-wrap').classList.remove('hidden');
    document.getElementById('h-success-wrap').classList.add('hidden');
    showOnly(panelHorario);
  });
  document.getElementById('h-cancel').addEventListener('click', () => showOnly(null));
  document.getElementById('h-confirm').addEventListener('click', () => {
    const fecha = document.getElementById('h-fecha').value;
    const horaInicio = document.getElementById('h-inicio').value;
    const horaFin = document.getElementById('h-fin').value;
    const motivo = document.getElementById('h-motivo').value.trim();

    if (!fecha) {
      setMsg('h-msg', 'Elegí un día.', 'error');
      return;
    }
    if (!horaInicio || !horaFin) {
      setMsg('h-msg', 'Completá desde y hasta.', 'error');
      return;
    }

    setMsg('h-msg', 'Bloqueando...', '');
    fetch('/api/gestion/bloquear-horario', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: gestionKey, date: fecha, horaInicio, horaFin, motivo }),
    })
      .then((r) => { if (r.status === 401) { onUnauthorized(); throw new Error('unauthorized'); } return r.json(); })
      .then((res) => {
        if (res.success) {
          hFechaBloqueada = fecha;
          document.getElementById('h-success-text').textContent = res.message;
          document.getElementById('h-form-wrap').classList.add('hidden');
          document.getElementById('h-success-wrap').classList.remove('hidden');
        } else {
          setMsg('h-msg', res.message, 'error');
        }
      })
      .catch((err) => { if (err.message !== 'unauthorized') setMsg('h-msg', 'Error de red.', 'error'); });
  });
  document.getElementById('h-done').addEventListener('click', () => showOnly(null));
  document.getElementById('h-goto').addEventListener('click', () => {
    if (!hFechaBloqueada) { showOnly(null); return; }
    currentDate = hFechaBloqueada;
    dateInput.value = currentDate;
    updateTodayBtn();
    showOnly(null);
    cargarAgenda();
  });

  // ---------- Bloquear / desbloquear día completo ----------
  let bFechaBloqueada = null;

  btnToggleBloqueoDia.addEventListener('click', () => {
    const bloqueado = diaBloqueadoCompleto();
    if (bloqueado) {
      if (!confirm('¿Desbloquear este día?')) return;
      fetch('/api/gestion/bloqueo-dia', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: gestionKey, accion: 'desbloquear', date: currentDate }),
      })
        .then((r) => { if (r.status === 401) { onUnauthorized(); throw new Error('unauthorized'); } return r.json(); })
        .then(() => cargarAgenda())
        .catch(() => {});
    } else {
      document.getElementById('b-fecha').value = currentDate;
      document.getElementById('b-motivo').value = '';
      setMsg('b-msg', '', '');
      document.getElementById('b-form-wrap').classList.remove('hidden');
      document.getElementById('b-success-wrap').classList.add('hidden');
      showOnly(panelBloqueoDia);
    }
  });
  document.getElementById('b-cancel').addEventListener('click', () => showOnly(null));
  document.getElementById('b-confirm').addEventListener('click', () => {
    const fecha = document.getElementById('b-fecha').value;
    const motivo = document.getElementById('b-motivo').value.trim();

    if (!fecha) {
      setMsg('b-msg', 'Elegí un día.', 'error');
      return;
    }

    setMsg('b-msg', 'Bloqueando...', '');
    fetch('/api/gestion/bloqueo-dia', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: gestionKey, accion: 'bloquear', date: fecha, motivo }),
    })
      .then((r) => { if (r.status === 401) { onUnauthorized(); throw new Error('unauthorized'); } return r.json(); })
      .then((res) => {
        if (res.success) {
          bFechaBloqueada = fecha;
          document.getElementById('b-success-text').textContent = res.message;
          document.getElementById('b-form-wrap').classList.add('hidden');
          document.getElementById('b-success-wrap').classList.remove('hidden');
        } else {
          setMsg('b-msg', res.message, 'error');
        }
      })
      .catch((err) => { if (err.message !== 'unauthorized') setMsg('b-msg', 'Error de red.', 'error'); });
  });
  document.getElementById('b-done').addEventListener('click', () => showOnly(null));
  document.getElementById('b-goto').addEventListener('click', () => {
    if (!bFechaBloqueada) { showOnly(null); return; }
    currentDate = bFechaBloqueada;
    dateInput.value = currentDate;
    updateTodayBtn();
    showOnly(null);
    cargarAgenda();
  });

  // ---------- Mover ----------
  function abrirMover(item) {
    moverContext = { eventId: item.id, calendarId: item.calendarId };
    const fechaItem = new Intl.DateTimeFormat('en-CA', { timeZone: TIME_ZONE, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(item.start));
    document.getElementById('m-fecha').value = fechaItem;
    document.getElementById('m-hora').value = fmtHora(item.start);
    document.getElementById('m-motivo').value = extraerMotivo(item.description, item.tipo);
    setMsg('m-msg', '', '');
    showOnly(panelMover);
  }
  document.getElementById('m-cancel').addEventListener('click', () => showOnly(null));
  document.getElementById('m-confirm').addEventListener('click', () => {
    const nuevaFecha = document.getElementById('m-fecha').value;
    const nuevaHora = document.getElementById('m-hora').value;
    const motivo = document.getElementById('m-motivo').value.trim();
    if (!nuevaFecha || !nuevaHora || !moverContext) return;

    setMsg('m-msg', 'Moviendo...', '');
    fetch('/api/gestion/evento', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: gestionKey, accion: 'mover', eventId: moverContext.eventId, calendarId: moverContext.calendarId, nuevaFecha, nuevaHora, motivo }),
    })
      .then((r) => { if (r.status === 401) { onUnauthorized(); throw new Error('unauthorized'); } return r.json(); })
      .then((res) => {
        setMsg('m-msg', res.message, res.success ? 'ok' : 'error');
        if (res.success) {
          showOnly(null);
          if (currentView === 'busqueda') ejecutarBusqueda(); else cargarAgenda();
        }
      })
      .catch((err) => { if (err.message !== 'unauthorized') setMsg('m-msg', 'Error de red.', 'error'); });
  });

  // ---------- Cancelar ----------
  function cancelarItem(item) {
    if (!confirm(`¿Cancelar el turno de "${item.title}"?`)) return;
    fetch('/api/gestion/evento', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: gestionKey, accion: 'cancelar', eventId: item.id, calendarId: item.calendarId }),
    })
      .then((r) => { if (r.status === 401) { onUnauthorized(); throw new Error('unauthorized'); } return r.json(); })
      .then(() => {
        if (currentView === 'busqueda') ejecutarBusqueda();
        else if (currentView === 'semana') cargarSemana();
        else cargarAgenda();
      })
      .catch(() => {});
  }

  function setMsg(id, text, type) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'panel-msg' + (type ? ' ' + type : '');
    if (!text) el.classList.add('hidden'); else el.classList.remove('hidden');
  }

  // ---------- Autocompletar teléfono al escribir el nombre ----------
  function wireAutocompletarTelefono(nombreId, apellidoId, telefonoId) {
    let debounce = null;
    function trigger() {
      clearTimeout(debounce);
      debounce = setTimeout(() => {
        const nombreCompleto = (document.getElementById(nombreId).value + ' ' + document.getElementById(apellidoId).value).trim();
        const telInput = document.getElementById(telefonoId);
        if (!nombreCompleto || telInput.value.trim()) return;
        fetch(`/api/gestion/buscar?modo=telefono&nombre=${encodeURIComponent(nombreCompleto)}&key=${encodeURIComponent(gestionKey)}`)
          .then((r) => (r.ok ? r.json() : { telefono: null }))
          .then((data) => {
            if (data.telefono && !telInput.value.trim()) telInput.value = data.telefono;
          })
          .catch(() => {});
      }, 500);
    }
    document.getElementById(nombreId).addEventListener('blur', trigger);
    document.getElementById(apellidoId).addEventListener('blur', trigger);
  }
  wireAutocompletarTelefono('t-nombre', 't-apellido', 't-telefono');
  wireAutocompletarTelefono('mc-nombre', 'mc-apellido', 'mc-telefono');

  // ---------- Dropdown de autocompletado de pacientes mientras se escribe ----------
  function wireAutocompletePacientes(nombreId, dropdownId, apellidoId, telefonoId) {
    const nombreInput = document.getElementById(nombreId);
    const dropdownEl = document.getElementById(dropdownId);
    let debounce = null;
    let resultadosActuales = [];

    function cerrarDropdown() {
      dropdownEl.classList.add('hidden');
      dropdownEl.innerHTML = '';
      resultadosActuales = [];
    }

    function aplicarSeleccion(p) {
      const partes = p.nombre.split(' ');
      document.getElementById(nombreId).value = partes.shift() || '';
      document.getElementById(apellidoId).value = partes.join(' ');
      if (p.telefono) document.getElementById(telefonoId).value = p.telefono;
      cerrarDropdown();
    }

    function renderDropdown(resultados) {
      resultadosActuales = resultados || [];
      if (resultadosActuales.length === 0) { cerrarDropdown(); return; }
      dropdownEl.innerHTML = resultadosActuales
        .map((p, i) => `<div class="autocomplete-item" data-idx="${i}">${escapeHtml(p.nombre)}</div>`)
        .join('');
      dropdownEl.classList.remove('hidden');
      dropdownEl.querySelectorAll('.autocomplete-item').forEach((el) => {
        el.addEventListener('mousedown', (e) => {
          e.preventDefault();
          aplicarSeleccion(resultadosActuales[parseInt(el.dataset.idx, 10)]);
        });
      });
    }

    nombreInput.addEventListener('input', () => {
      clearTimeout(debounce);
      const q = nombreInput.value.trim();
      if (q.length < 3) { cerrarDropdown(); return; }
      debounce = setTimeout(() => {
        fetch(`/api/gestion/buscar?modo=pacientes&q=${encodeURIComponent(q)}&key=${encodeURIComponent(gestionKey)}`)
          .then((r) => (r.ok ? r.json() : []))
          .then(renderDropdown)
          .catch(() => cerrarDropdown());
      }, 300);
    });

    document.addEventListener('click', (e) => {
      if (e.target !== nombreInput && !dropdownEl.contains(e.target)) cerrarDropdown();
    });
  }
  wireAutocompletePacientes('t-nombre', 't-nombre-dropdown', 't-apellido', 't-telefono');
  wireAutocompletePacientes('mc-nombre', 'mc-nombre-dropdown', 'mc-apellido', 'mc-telefono');

  // ---------- Arranque ----------
  if (gestionKey) verificarYArrancar();
})();
</script>
