<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detalles de tu turno | Franco Vinzón Odontólogo</title>
<meta name="description" content="Consultá y confirmá tu turno en el Consultorio Odontológico Franco Vinzón, Concepción del Uruguay.">
<meta name="robots" content="noindex">
<!-- Open Graph — así el link corto /t/CODIGO (que redirige acá) muestra una vista
     previa prolija cuando se comparte por WhatsApp, en vez de una tarjeta gris genérica
     con el dominio de Vercel pelado. -->
<meta property="og:title" content="Tu turno — Franco Vinzón Odontólogo">
<meta property="og:description" content="Consultá y confirmá tu turno.">
<meta property="og:image" content="https://od-francovinzon.vercel.app/assets/isologo.png">
<meta property="og:type" content="website">
<link rel="icon" href="../assets/isologo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1E3A5F; --navy-soft: #3E5A80; --gold: #D4A24C;
    --cream: #FAF9F6; --cream-deep: #F1ECE2; --white: #FFFFFF;
    --text: #2A2A2A; --muted: #8A8578; --disabled: #D7D2C6; --success: #25D366;
    --radius-pill: 100px; --radius-card: 22px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--cream); color: var(--text);
    font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  .turnos-page { max-width: 460px; margin: 0 auto; padding: 28px 18px 60px; }
  h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; color: var(--navy); margin: 0; }
  .brand { text-align: center; margin-bottom: 18px; }
  .brand img { width: 100%; max-width: 280px; height: auto; margin-bottom: 12px; }
  .brand .tagline { font-family: 'Fraunces', Georgia, serif; font-size: 27px; font-weight: 700; color: var(--navy); }
  .brand .subtitle { color: var(--muted); font-size: 13px; margin-top: 3px; letter-spacing: 0.2px; }
  .card { background: var(--white); border-radius: var(--radius-card); padding: 20px 18px; margin-bottom: 18px; box-shadow: 0 2px 18px rgba(30, 58, 95, 0.06); }
  .hidden { display: none !important; }

  /* ---------- Tarjeta "Detalles de tu turno" ----------
     Deliberadamente distinta de la pantalla de éxito post-reserva (sin el ✓
     verde ni el texto "Turno confirmado"): un ícono de ticket, el nombre del
     paciente bien grande, y la fecha/hora en un renglón dorado propio — misma
     paleta navy/dorado/crema del resto del sitio, otro tratamiento visual. */
  .lookup-icon { width: 52px; height: 52px; border-radius: 50%; background: var(--cream-deep); color: var(--navy); font-size: 24px; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; }
  .lookup-card { text-align: center; padding: 26px 20px; }
  .lookup-badge-sobreturno { display: inline-block; background: var(--gold); color: var(--white); font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; padding: 4px 12px; border-radius: var(--radius-pill); margin-bottom: 10px; }
  .lookup-nombre { font-size: 19px; font-weight: 700; color: var(--navy); margin-bottom: 6px; }
  .lookup-fecha { font-size: 15px; font-weight: 700; color: var(--gold); background: rgba(212,162,76,.12); border-radius: var(--radius-pill); padding: 7px 16px; display: inline-block; }

  .lookup-card, .card.error-card { opacity: 0; transform: translateY(10px); transition: opacity .22s ease, transform .22s ease; }
  .lookup-card.card-visible, .card.error-card.card-visible { opacity: 1; transform: translateY(0); }

  .error-card { text-align: center; }
  .error-card p { color: var(--muted); font-size: 13.5px; line-height: 1.5; margin: 12px 0 18px; }

  button, .card, .post-action-btn {
    transition: transform .15s ease, box-shadow .18s ease, background-color .18s ease, border-color .18s ease, opacity .18s ease;
  }
  button { cursor: pointer; }
  button:active:not(:disabled), .post-action-btn:active { transform: scale(0.96); }

  .post-actions-row { display: flex; flex-direction: column; gap: 9px; }
  .post-action-btn {
    width: 100%; padding: 12px; border-radius: var(--radius-pill); font-family: 'Inter', sans-serif;
    font-size: 13.5px; font-weight: 600; border: 1.5px solid var(--navy-soft); background: var(--white); color: var(--navy);
    text-align: center; text-decoration: none; cursor: pointer; box-sizing: border-box;
  }
  .post-action-btn:hover { background: var(--cream-deep); }
  .post-action-btn.confirmar { background: var(--success); border-color: var(--success); color: var(--white); }
  .post-action-btn.confirmar:hover { background: var(--success); filter: brightness(1.05); }
  .post-action-btn:disabled { opacity: .65; cursor: default; }
  .post-action-btn:disabled:hover { background: var(--white); }
  .post-action-btn.confirmar:disabled { background: var(--success); filter: none; }

  #toast-container {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 999;
    display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none;
  }
  .toast {
    background: var(--navy); color: var(--white); padding: 11px 20px; border-radius: 100px;
    font-size: 13px; font-weight: 600; box-shadow: 0 8px 24px rgba(30,58,95,.28);
    opacity: 0; transform: translateY(-10px); transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<div class="turnos-page">
  <div class="brand">
    <img src="../assets/logo-horizontal.png" alt="Franco Vinzón Odontólogo">
    <div class="tagline">Detalles de tu turno</div>
    <div class="subtitle">Ameghino 410, Concepción del Uruguay</div>
  </div>

  <div class="card lookup-card hidden" id="turno-lookup-card">
    <div class="lookup-icon">🦷</div>
    <div class="lookup-badge-sobreturno hidden" id="lookup-badge-sobreturno">Sobreturno</div>
    <div class="lookup-nombre" id="lookup-nombre"></div>
    <div class="lookup-fecha" id="lookup-fecha"></div>
  </div>

  <div class="card error-card hidden" id="turno-lookup-error-card">
    <h3>No encontramos ese turno</h3>
    <p id="turno-lookup-error-text"></p>
    <a class="post-action-btn" href="/turnos">Ir a reservar un turno</a>
  </div>

  <div class="card hidden" id="post-actions-card">
    <div class="post-actions-row">
      <button class="post-action-btn confirmar" id="btn-confirmar-turno">✅ Confirmo el turno</button>
      <a class="post-action-btn" id="btn-agregar-apple" href="#">📅 Agregar a Apple Calendar</a>
      <a class="post-action-btn" id="btn-agregar-google" href="#" target="_blank" rel="noopener noreferrer">📅 Agregar a Google Calendar</a>
    </div>
  </div>
</div>

<div id="toast-container" aria-live="polite"></div>

<script>
(function () {
  const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const pad2 = (n) => (n < 10 ? '0' + n : '' + n);

  const TIME_ZONE = 'America/Argentina/Buenos_Aires';
  const hoyArgStr = new Intl.DateTimeFormat('en-CA', {
    timeZone: TIME_ZONE, year: 'numeric', month: '2-digit', day: '2-digit',
  }).format(new Date());
  const [hoyYear, hoyMonth, hoyDay] = hoyArgStr.split('-').map(Number);

  let fechaSeleccionada = null;
  let horarioSeleccionado = null;
  let ultimoEventId = null;
  let ultimoCalendarId = null;

  const postActionsCard = document.getElementById('post-actions-card');
  const btnConfirmarTurno = document.getElementById('btn-confirmar-turno');
  const turnoLookupCard = document.getElementById('turno-lookup-card');
  const turnoLookupErrorCard = document.getElementById('turno-lookup-error-card');

  const toastContainer = document.getElementById('toast-container');
  function toast(mensaje) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = mensaje;
    toastContainer.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => {
      el.classList.remove('show');
      setTimeout(() => el.remove(), 250);
    }, 2600);
  }

  // ---------- Estado visual del botón "Confirmo el turno" ----------
  function marcarBotonConfirmado(confirmado) {
    btnConfirmarTurno.disabled = confirmado;
    btnConfirmarTurno.textContent = confirmado ? '✓ Turno confirmado' : '✅ Confirmo el turno';
  }

  function mostrarCardAnimada(el) {
    el.classList.remove('hidden');
    el.classList.remove('card-visible');
    void el.offsetWidth;
    requestAnimationFrame(() => el.classList.add('card-visible'));
  }

  // ---------- Agregar al calendario del dispositivo (mismo criterio que /turnos) ----------
  function limitesUTC(fechaStr, horaStr) {
    const [y, m, d] = fechaStr.split('-').map(Number);
    const [hh, mm] = horaStr.split(':').map(Number);
    const startUTC = new Date(Date.UTC(y, m - 1, d, hh + 3, mm, 0));
    const endUTC = new Date(startUTC.getTime() + 30 * 60000);
    return { startUTC, endUTC };
  }
  const fmtUTC = (dt) => dt.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';

  // ---------- Ventana en la que tiene sentido mostrar "Confirmo el turno" ----------
  // No tiene sentido pedirle a alguien que confirme un turno reservado hoy para dentro
  // de tres semanas — el botón solo aparece cerca de la fecha real (72hs antes), que es
  // cuando Ayelen manda el recordatorio por WhatsApp con este mismo link. Mismo patrón
  // de timezone fijo (America/Argentina/Buenos_Aires, sin DST) que limitesUTC de arriba
  // — nunca Date/hora local del navegador. Es el mismo link siempre: la aparición
  // depende únicamente de qué tan cerca está la fecha en el momento en que se abre,
  // no de por dónde se llegó acá (QR, WhatsApp, o "Guardar acceso a mi turno").
  const VENTANA_CONFIRMAR_MS = 72 * 60 * 60000;
  function dentroDeVentanaConfirmar(fechaStr, horaStr) {
    const { startUTC } = limitesUTC(fechaStr, horaStr);
    return startUTC.getTime() - Date.now() <= VENTANA_CONFIRMAR_MS;
  }

  function construirICS(fechaStr, horaStr) {
    const { startUTC, endUTC } = limitesUTC(fechaStr, horaStr);
    const uid = `turno-${fechaStr}-${horaStr.replace(':', '')}-${Math.random().toString(36).slice(2)}@odontologofrancovinzon`;
    return [
      'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Franco Vinzon Odontologo//Turnos//ES', 'CALSCALE:GREGORIAN',
      'BEGIN:VEVENT',
      `UID:${uid}`,
      `DTSTAMP:${fmtUTC(new Date())}`,
      `DTSTART:${fmtUTC(startUTC)}`,
      `DTEND:${fmtUTC(endUTC)}`,
      'SUMMARY:Turno odontológico - Franco Vinzón',
      'LOCATION:Ameghino 410\\, Concepción del Uruguay',
      'DESCRIPTION:Turno en el Consultorio Odontológico Franco Vinzón.',
      'END:VEVENT', 'END:VCALENDAR',
    ].join('\r\n');
  }

  function armarLinkGoogleCalendar(fechaStr, horaStr) {
    const { startUTC, endUTC } = limitesUTC(fechaStr, horaStr);
    const params = new URLSearchParams({
      action: 'TEMPLATE',
      text: 'Turno odontológico - Franco Vinzón',
      dates: `${fmtUTC(startUTC)}/${fmtUTC(endUTC)}`,
      details: 'Turno en el Consultorio Odontológico Franco Vinzón.',
      location: 'Ameghino 410, Concepción del Uruguay',
    });
    return `https://calendar.google.com/calendar/render?${params.toString()}`;
  }

  const btnAgregarApple = document.getElementById('btn-agregar-apple');
  const btnAgregarGoogle = document.getElementById('btn-agregar-google');
  let ultimoIcsUrl = null;

  function actualizarLinksCalendario() {
    if (!fechaSeleccionada || !horarioSeleccionado) return;
    if (ultimoIcsUrl) URL.revokeObjectURL(ultimoIcsUrl);
    const blob = new Blob([construirICS(fechaSeleccionada, horarioSeleccionado)], { type: 'text/calendar;charset=utf-8' });
    ultimoIcsUrl = URL.createObjectURL(blob);
    btnAgregarApple.href = ultimoIcsUrl;
    btnAgregarGoogle.href = armarLinkGoogleCalendar(fechaSeleccionada, horarioSeleccionado);
  }

  // ---------- Confirmar turno ----------
  // Acción SIEMPRE disponible, incluso el mismo día del turno — no hay ninguna
  // restricción de fecha acá (ver decisions.md): confirmar asistencia el día de
  // hoy sigue siendo útil. Cancelar, reprogramar y "no estoy seguro" se sacaron de
  // esta página (ver el pedido, 2026-08-14) — un paciente que necesite eso escribe
  // por WhatsApp y Ayelen lo resuelve desde /gestion.
  btnConfirmarTurno.addEventListener('click', () => {
    if (!ultimoEventId || btnConfirmarTurno.disabled) return;
    btnConfirmarTurno.disabled = true;
    fetch('/api/reservar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accion: 'confirmar', eventId: ultimoEventId, calendarId: ultimoCalendarId }),
    })
      .then((r) => r.json())
      .then((res) => {
        if (res.success) {
          marcarBotonConfirmado(true);
          toast('✅ ¡Gracias por confirmar!');
        } else {
          btnConfirmarTurno.disabled = false;
          toast(res.message || 'No se pudo confirmar. Probá de nuevo.');
        }
      })
      .catch(() => {
        btnConfirmarTurno.disabled = false;
        toast('Error de red. Probá de nuevo.');
      });
  });

  // ---------- Punto de entrada: /turno?eventId=... (QR del ticket térmico) ----------
  // Página propia, distinta de la confirmación post-reserva de /turnos: siempre
  // arranca mostrando el turno existente (nunca el calendario de reserva), y
  // reusa tal cual la API de /api/reservar (acciones "obtener"/"mover"/"cancelar").
  function mostrarTurnoDesdeUrl(eventId, calendarId, esSobreturno) {
    fetch('/api/reservar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accion: 'obtener', eventId, calendarId }),
    })
      .then((r) => r.json())
      .then((res) => {
        if (!res.success) {
          document.getElementById('turno-lookup-error-text').textContent = res.message;
          mostrarCardAnimada(turnoLookupErrorCard);
          return;
        }
        ultimoEventId = eventId;
        ultimoCalendarId = calendarId;
        fechaSeleccionada = res.date;
        horarioSeleccionado = res.time;
        const [, m, d] = res.date.split('-').map(Number);
        document.getElementById('lookup-nombre').textContent = res.nombre;
        document.getElementById('lookup-fecha').textContent = `${d} de ${MESES[m - 1]} a las ${res.time} hs.`;
        document.getElementById('lookup-badge-sobreturno').classList.toggle('hidden', !esSobreturno);
        mostrarCardAnimada(turnoLookupCard);
        actualizarLinksCalendario();
        marcarBotonConfirmado(!!res.confirmado);
        // Excepción a la ventana de 72hs (ver el pedido, 2026-08-14): si Ayelen ya mandó
        // el "Pedido de confirmación" desde /gestion (sin importar cuánto faltaba), el
        // botón tiene que estar habilitado igual.
        btnConfirmarTurno.classList.toggle('hidden', !(dentroDeVentanaConfirmar(res.date, res.time) || res.confirmacionSolicitada));
        postActionsCard.classList.remove('hidden');
      })
      .catch(() => {
        document.getElementById('turno-lookup-error-text').textContent = 'No se pudo consultar el turno. Probá de nuevo en un momento.';
        mostrarCardAnimada(turnoLookupErrorCard);
      });
  }

  const paramsUrl = new URLSearchParams(location.search);
  const eventIdDesdeUrl = paramsUrl.get('eventId');
  if (eventIdDesdeUrl) {
    mostrarTurnoDesdeUrl(eventIdDesdeUrl, paramsUrl.get('calendarId'), paramsUrl.get('tipo') === 'sobreturno');
  } else {
    document.getElementById('turno-lookup-error-text').textContent = 'Este link no incluye ningún turno para mostrar.';
    mostrarCardAnimada(turnoLookupErrorCard);
  }
})();
</script>
</body>
</html>
