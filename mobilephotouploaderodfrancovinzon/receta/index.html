<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vista previa de receta | Franco Vinzón Odontólogo</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../../assets/isologo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1E3A5F; --gold: #D4A24C; --cream: #FAF9F6; --line: #E9E4D8;
    --white: #FFFFFF; --text: #2A2A2A; --muted: #8A8578; --bad: #C1443A; --ok: #4F9A3C;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--cream); color: var(--text); font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 17px; }
  h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; color: var(--navy); margin: 0; }
  .hidden { display: none !important; }
  button { font-family: inherit; cursor: pointer; }
  input, textarea { font-family: inherit; font-size: 16px; }

  #app { max-width: 480px; margin: 0 auto; padding: 20px 16px 60px; }
  .brand { text-align: center; margin-bottom: 18px; }
  .brand img { width: 200px; max-width: 65vw; height: auto; }
  .brand h1 { font-size: 20px; margin-top: 8px; }

  .card { background: var(--white); border-radius: 16px; padding: 18px; box-shadow: 0 1px 8px rgba(30,58,95,.06); margin-bottom: 16px; }
  .hint { color: var(--muted); font-size: 14.5px; margin-top: 8px; }

  .resultado-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 4px; border-bottom: 1px solid var(--line); gap: 10px; cursor: pointer; }
  .resultado-row:last-child { border-bottom: none; }
  .resultado-row .nombre { font-weight: 600; }
  .resultado-row .dni { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .resultado-row.nuevo .nombre { color: var(--navy); }

  .receta-warning { background: #FCEFD8; border: 1.5px solid var(--gold); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; color: var(--navy); margin-bottom: 12px; }
  .receta-warning.grave { background: #FCE4E0; border-color: #C0392B; }
  .field { margin-top: 12px; }
  .field label { display: block; font-size: 14px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
  .field input, .field textarea { width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--cream); }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--gold); background: var(--white); }
  .field.falta input, .field.falta textarea { border-color: #C0392B; background: #FCE4E0; }
  .receta-med-item { border: 1.5px solid var(--line); border-radius: 10px; padding: 10px; margin-top: 12px; position: relative; }
  .receta-med-quitar { position: absolute; top: 8px; right: 8px; background: none; border: none; color: var(--muted); font-size: 15px; }
  .receta-med-agregar { background: var(--white); color: var(--navy); border: 1.5px dashed var(--line); border-radius: 10px; padding: 10px; width: 100%; font-weight: 600; font-size: 14px; margin-top: 12px; }
  .btn-primario { width: 100%; margin-top: 16px; background: var(--gold); color: var(--white); border: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 17px; }
  .btn-primario:disabled { opacity: .55; }
  .msg { font-size: 14.5px; margin-top: 10px; min-height: 16px; }
  .msg.error { color: var(--bad); }
  .msg.ok { color: var(--ok); }
  .spinner { display: inline-block; width: 30px; height: 30px; border: 3px solid var(--line); border-top-color: var(--gold); border-radius: 50%; animation: girar .7s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }
  .centrado { text-align: center; padding: 30px 0; }
</style>
</head>
<body>

<div id="app">
  <div class="brand">
    <img src="../../assets/logo-horizontal.png" alt="Franco Vinzón Odontólogo">
    <h1>Vista previa de receta</h1>
  </div>

  <div class="card" id="card-cargando">
    <div class="centrado"><div class="spinner"></div><p class="hint" style="margin-top:12px;">Leyendo la receta...</p></div>
  </div>

  <div class="card hidden" id="card-error">
    <p id="error-texto" class="hint"></p>
  </div>

  <div class="card hidden" id="card-paciente">
    <h2 style="font-size:17px; margin-bottom:10px;">¿A quién pertenece?</h2>
    <div id="paciente-confirmado" class="hidden">
      <p><strong id="paciente-confirmado-nombre"></strong></p>
    </div>
    <div id="paciente-lista"></div>
    <div id="paciente-nuevo-form" class="hidden">
      <p class="hint">Se va a crear una ficha nueva con estos datos:</p>
      <div class="field"><label>Nombre</label><input type="text" id="np-nombre"></div>
      <div class="field"><label>Apellido</label><input type="text" id="np-apellido"></div>
      <div class="field"><label>DNI</label><input type="text" id="np-dni"></div>
    </div>
  </div>

  <div class="card hidden" id="card-form">
    <div id="receta-warnings"></div>
    <p class="hint" style="margin-bottom:6px;">Revisá los datos extraídos del PDF antes de guardar — corregí lo que haga falta. Esto NO reemplaza la receta electrónica original, es solo una versión prolija para compartir.</p>

    <div class="field" id="campo-fechaReceta"><label>Fecha de receta</label><input type="text" id="receta-fechaReceta"></div>
    <div class="field" id="campo-cuir"><label>Código / CUIR (Recetario)</label><input type="text" id="receta-cuir"></div>
    <div class="field" id="campo-nroAfiliado"><label>Nro Afiliado</label><input type="text" id="receta-nroAfiliado"></div>

    <div id="receta-medicamentos"></div>
    <button type="button" class="receta-med-agregar" id="receta-med-agregar">+ Agregar medicamento</button>

    <div class="field"><label>Posología / Notas</label><textarea id="receta-posologia" rows="2"></textarea></div>
    <div class="field" id="campo-profesional-nombre"><label>Profesional</label><input type="text" id="receta-profesional-nombre"></div>
    <div class="field" id="campo-profesional-matricula"><label>Matrícula</label><input type="text" id="receta-profesional-matricula"></div>
    <div class="field"><label>Profesión</label><input type="text" id="receta-profesional-profesion"></div>

    <button class="btn-primario" id="btn-guardar">Guardar y compartir</button>
    <div class="msg" id="guardar-msg"></div>
  </div>
</div>

<script>
  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  const codigo = new URLSearchParams(location.search).get('codigo');
  const cardCargando = document.getElementById('card-cargando');
  const cardError = document.getElementById('card-error');
  const cardPaciente = document.getElementById('card-paciente');
  const cardForm = document.getElementById('card-form');
  const medContainer = document.getElementById('receta-medicamentos');

  let recetaData = null;
  let pacienteIdElegido = null;
  let crearNuevoFlag = false;
  let medIdx = 0;

  function mostrarError(texto) {
    cardCargando.classList.add('hidden');
    cardError.classList.remove('hidden');
    document.getElementById('error-texto').textContent = texto;
  }

  async function cargar() {
    if (!codigo) { mostrarError('Falta el código de la receta en el link.'); return; }
    try {
      const r = await fetch(`/api/gestion/pacientes?modo=receta-proceso&codigo=${encodeURIComponent(codigo)}`);
      if (!r.ok) {
        const err = await r.json().catch(() => ({}));
        mostrarError(err.error || 'No se pudo cargar la receta.');
        return;
      }
      recetaData = await r.json();
      cardCargando.classList.add('hidden');
      renderPaciente();
      renderForm();
      cardPaciente.classList.remove('hidden');
      cardForm.classList.remove('hidden');
    } catch {
      mostrarError('No se pudo cargar la receta. Revisá tu conexión.');
    }
  }
  cargar();

  // ---------- A quién pertenece ----------
  function splitNombreApellido(pacienteTexto) {
    // Convención de MisRX/RCTA: "APELLIDO NOMBRE" (ver el pedido, confirmado con el PDF
    // de muestra real: "VINZON FAUSTO" = apellido Vinzón, nombre Fausto). Es solo un
    // punto de partida editable — Franco confirma/corrige antes de crear la ficha.
    const partes = String(pacienteTexto || '').trim().split(/\s+/);
    if (partes.length < 2) return { apellido: partes[0] || '', nombre: '' };
    return { apellido: partes[0], nombre: partes.slice(1).join(' ') };
  }

  function renderPaciente() {
    const { receta, matchAutomatico, candidatos } = recetaData;
    const lista = document.getElementById('paciente-lista');
    const nuevoForm = document.getElementById('paciente-nuevo-form');
    const confirmado = document.getElementById('paciente-confirmado');

    if (matchAutomatico) {
      pacienteIdElegido = matchAutomatico.id;
      confirmado.classList.remove('hidden');
      document.getElementById('paciente-confirmado-nombre').textContent = `${matchAutomatico.nombre} ${matchAutomatico.apellido}`;
      lista.innerHTML = '';
      return;
    }

    const opciones = candidatos || [];
    lista.innerHTML = opciones.map((c) => `
      <div class="resultado-row" data-id="${c.id}">
        <div><div class="nombre">${escapeHtml(c.nombre)} ${escapeHtml(c.apellido)}</div><div class="dni">DNI ${escapeHtml(c.dni || '—')}</div></div>
        <span>Elegir</span>
      </div>
      `).join('') + `
      <div class="resultado-row nuevo" data-id="__nuevo__">
        <div><div class="nombre">Ninguno de estos</div><div class="dni">Crear una ficha nueva</div></div>
        <span>+</span>
      </div>
    `;
    lista.querySelectorAll('.resultado-row').forEach((el) => {
      el.addEventListener('click', () => {
        lista.querySelectorAll('.resultado-row').forEach((r) => r.style.background = '');
        el.style.background = 'var(--cream)';
        if (el.dataset.id === '__nuevo__') {
          crearNuevoFlag = true;
          pacienteIdElegido = null;
          nuevoForm.classList.remove('hidden');
        } else {
          crearNuevoFlag = false;
          pacienteIdElegido = el.dataset.id;
          nuevoForm.classList.add('hidden');
        }
      });
    });

    const { nombre, apellido } = splitNombreApellido(receta.paciente);
    document.getElementById('np-nombre').value = nombre;
    document.getElementById('np-apellido').value = apellido;
    document.getElementById('np-dni').value = receta.dni || '';

    if (!opciones.length) {
      // Sin ningún candidato — se va derecho al alta de ficha nueva (ver el pedido,
      // 2026-08-20), sin obligar a Franco a tocar "Ninguno de estos" para algo obvio.
      crearNuevoFlag = true;
      nuevoForm.classList.remove('hidden');
    }
  }

  // ---------- Formulario de la receta (mismos campos/lógica que /pacientes) ----------
  function marcarCampo(idCampo, faltante) {
    const el = document.getElementById(idCampo);
    if (el) el.classList.toggle('falta', faltante);
  }

  function renderForm() {
    const { receta, camposFaltantes, matchAutomatico, candidatos } = recetaData;
    const warnings = document.getElementById('receta-warnings');
    let html = '';
    if (candidatos && candidatos.length > 1 && !matchAutomatico) {
      html += `<div class="receta-warning">Elegí arriba a qué paciente pertenece esta receta antes de guardar.</div>`;
    } else if (!receta.paciente) {
      html += `<div class="receta-warning">No pude leer el nombre del paciente en el PDF. Revisá los datos antes de guardar.</div>`;
    }
    if ((camposFaltantes || []).includes('firmaElectronicaUrl')) {
      html += `<div class="receta-warning">No pude leer el QR de firma electrónica del PDF original — la receta linda va a quedar con un espacio para firmar y sellar a mano en su lugar.</div>`;
    }
    warnings.innerHTML = html;

    document.getElementById('receta-fechaReceta').value = receta.fechaReceta || '';
    document.getElementById('receta-cuir').value = receta.cuir || '';
    document.getElementById('receta-nroAfiliado').value = receta.nroAfiliado || '';
    document.getElementById('receta-posologia').value = receta.posologia || '';
    document.getElementById('receta-profesional-nombre').value = receta.profesional?.nombre || '';
    document.getElementById('receta-profesional-matricula').value = receta.profesional?.matricula || '';
    document.getElementById('receta-profesional-profesion').value = receta.profesional?.profesion || '';

    ['campo-fechaReceta', 'campo-cuir', 'campo-profesional-nombre', 'campo-profesional-matricula'].forEach((id) => marcarCampo(id, false));
    (camposFaltantes || []).forEach((c) => marcarCampo(`campo-${c.replace('.', '-')}`, true));

    medContainer.innerHTML = '';
    medIdx = 0;
    const meds = receta.medicamentos && receta.medicamentos.length ? receta.medicamentos : [{ descripcion: '', cantidad: '', diagnostico: '' }];
    meds.forEach((m) => agregarFilaMedicamento(m));
  }

  function agregarFilaMedicamento(m) {
    const idx = medIdx++;
    const div = document.createElement('div');
    div.className = 'receta-med-item';
    div.dataset.idx = idx;
    div.innerHTML = `
      <button type="button" class="receta-med-quitar" data-idx="${idx}">✕</button>
      <div class="field"><label>Medicamento</label><textarea rows="2" class="receta-med-descripcion">${escapeHtml(m.descripcion || '')}</textarea></div>
      <div class="field"><label>Cantidad</label><input type="text" class="receta-med-cantidad" value="${escapeHtml(m.cantidad || '')}"></div>
      <div class="field"><label>Diagnóstico</label><input type="text" class="receta-med-diagnostico" value="${escapeHtml(m.diagnostico || '')}"></div>
    `;
    medContainer.appendChild(div);
    div.querySelector('.receta-med-quitar').addEventListener('click', () => div.remove());
  }
  document.getElementById('receta-med-agregar').addEventListener('click', () => {
    agregarFilaMedicamento({ descripcion: '', cantidad: '', diagnostico: '' });
  });

  document.getElementById('btn-guardar').addEventListener('click', async () => {
    const msg = document.getElementById('guardar-msg');
    msg.className = 'msg';
    msg.textContent = '';

    if (!pacienteIdElegido && !crearNuevoFlag) {
      msg.className = 'msg error';
      msg.textContent = 'Elegí a qué paciente pertenece esta receta.';
      return;
    }
    let crearNuevo = null;
    if (crearNuevoFlag) {
      const nombre = document.getElementById('np-nombre').value.trim();
      const apellido = document.getElementById('np-apellido').value.trim();
      if (!nombre || !apellido) {
        msg.className = 'msg error';
        msg.textContent = 'Completá nombre y apellido para crear la ficha nueva.';
        return;
      }
      crearNuevo = { nombre, apellido, dni: document.getElementById('np-dni').value.trim() };
    }

    const medicamentos = Array.from(medContainer.querySelectorAll('.receta-med-item')).map((div) => ({
      descripcion: div.querySelector('.receta-med-descripcion').value.trim(),
      cantidad: div.querySelector('.receta-med-cantidad').value.trim(),
      diagnostico: div.querySelector('.receta-med-diagnostico').value.trim(),
    })).filter((m) => m.descripcion);
    if (!medicamentos.length) {
      msg.className = 'msg error';
      msg.textContent = 'Agregá al menos un medicamento.';
      return;
    }

    const receta = {
      fechaReceta: document.getElementById('receta-fechaReceta').value.trim(),
      cuir: document.getElementById('receta-cuir').value.trim(),
      nroAfiliado: document.getElementById('receta-nroAfiliado').value.trim(),
      // No es editable: es un link único de la receta original (ver lib/recetaFirmaQr.js
      // en el backend) — mostrarlo como texto invitaría a "corregirlo" y dejaría de
      // escanear al mismo lugar que la receta real.
      firmaElectronicaUrl: recetaData?.receta?.firmaElectronicaUrl || null,
      posologia: document.getElementById('receta-posologia').value.trim(),
      medicamentos,
      profesional: {
        nombre: document.getElementById('receta-profesional-nombre').value.trim(),
        matricula: document.getElementById('receta-profesional-matricula').value.trim(),
        profesion: document.getElementById('receta-profesional-profesion').value.trim(),
      },
    };

    const btn = document.getElementById('btn-guardar');
    btn.disabled = true;
    btn.textContent = 'Guardando...';
    try {
      const r = await fetch('/api/gestion/pacientes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          accion: 'receta-guardar',
          pacienteId: pacienteIdElegido || undefined,
          crearNuevo: crearNuevo || undefined,
          receta,
          codigoProceso: codigo,
        }),
      });
      const res = await r.json();
      if (res.success) {
        msg.className = 'msg ok';
        msg.textContent = res.fichaCreada && !res.fichaCreada.yaExistia
          ? `✅ Receta guardada. Se creó una ficha nueva para ${res.fichaCreada.nombre} ${res.fichaCreada.apellido}.`
          : '✅ Receta guardada.';
        btn.textContent = 'Guardada ✓';
        compartirRecetaGuardada(res.id, `${res.fichaCreada ? res.fichaCreada.nombre + ' ' + res.fichaCreada.apellido : ''}`);
      } else {
        msg.className = 'msg error';
        msg.textContent = res.message || 'No se pudo guardar la receta.';
        btn.disabled = false;
        btn.textContent = 'Guardar y compartir';
      }
    } catch {
      msg.className = 'msg error';
      msg.textContent = 'No se pudo guardar la receta. Revisá tu conexión.';
      btn.disabled = false;
      btn.textContent = 'Guardar y compartir';
    }
  });

  async function compartirRecetaGuardada(recetaId, nombreCompleto) {
    const url = `/api/gestion/pacientes?modo=receta-pdf&recetaId=${recetaId}`;
    try {
      const resp = await fetch(url);
      const blob = await resp.blob();
      const file = new File([blob], `Receta${nombreCompleto ? ' - ' + nombreCompleto : ''}.pdf`, { type: 'application/pdf' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], text: `Receta${nombreCompleto ? ' — ' + nombreCompleto : ''}` });
        return;
      }
      const objectUrl = URL.createObjectURL(blob);
      window.open(objectUrl, '_blank');
    } catch {
      // AbortError = cerró el panel de compartir sin elegir nada, no es un error real
    }
  }
</script>
</body>
</html>
