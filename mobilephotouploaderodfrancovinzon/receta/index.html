<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Receta | Franco Vinzón Odontólogo</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../../assets/isologo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1E3A5F; --gold: #D4A24C; --cream: #FAF9F6; --line: #E9E4D8;
    --white: #FFFFFF; --text: #2A2A2A; --muted: #8A8578; --bad: #C1443A; --ok: #4F9A3C;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--cream); color: var(--text); font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 17px; }
  h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; color: var(--navy); margin: 0; }
  .hidden { display: none !important; }
  button { font-family: inherit; cursor: pointer; }

  #app { max-width: 480px; margin: 0 auto; padding: 20px 16px 60px; }
  .brand { text-align: center; margin-bottom: 18px; }
  .brand img { width: 200px; max-width: 65vw; height: auto; }
  .brand h1 { font-size: 20px; margin-top: 8px; }

  .card { background: var(--white); border-radius: 16px; padding: 18px; box-shadow: 0 1px 8px rgba(30,58,95,.06); margin-bottom: 16px; }
  .hint { color: var(--muted); font-size: 14.5px; margin-top: 8px; }

  .resultado-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 4px; border-bottom: 1px solid var(--line); gap: 10px; cursor: pointer; }
  .resultado-row:last-child { border-bottom: none; }
  .resultado-row .nombre { font-weight: 600; }
  .resultado-row .dni { color: var(--muted); font-size: 14px; margin-top: 2px; }

  .btn-primario { width: 100%; margin-top: 16px; background: var(--gold); color: var(--white); border: none; padding: 16px; border-radius: 12px; font-weight: 700; font-size: 18px; }
  .btn-primario:disabled { opacity: .55; }
  .msg { font-size: 14.5px; margin-top: 10px; min-height: 16px; }
  .msg.error { color: var(--bad); }
  .msg.ok { color: var(--ok); }
  .spinner { display: inline-block; width: 30px; height: 30px; border: 3px solid var(--line); border-top-color: var(--gold); border-radius: 50%; animation: girar .7s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }
  .centrado { text-align: center; padding: 30px 0; }
  .check-ok { font-size: 46px; text-align: center; margin-bottom: 6px; }
  .listo-nombre { text-align: center; font-size: 20px; font-weight: 700; color: var(--navy); margin-bottom: 4px; }
  .listo-sub { text-align: center; color: var(--muted); font-size: 14.5px; margin-bottom: 4px; }
</style>
</head>
<body>

<div id="app">
  <div class="brand">
    <img src="../../assets/logo-horizontal.png" alt="Franco Vinzón Odontólogo">
    <h1>Receta</h1>
  </div>

  <div class="card" id="card-cargando">
    <div class="centrado"><div class="spinner"></div><p class="hint" id="cargando-texto" style="margin-top:12px;">Leyendo la receta...</p></div>
  </div>

  <div class="card hidden" id="card-error">
    <p id="error-texto" class="hint"></p>
  </div>

  <!-- Solo se muestra cuando hay más de un paciente posible y no se puede resolver
       solo (ver el pedido, 2026-08-20: sin revisión humana de los datos, pero elegir el
       paciente correcto sigue haciendo falta un toque si hay ambigüedad real). -->
  <div class="card hidden" id="card-paciente">
    <h2 style="font-size:17px; margin-bottom:10px;">¿A quién pertenece?</h2>
    <div id="paciente-lista"></div>
  </div>

  <div class="card hidden" id="card-listo">
    <div class="check-ok">✅</div>
    <div class="listo-nombre" id="listo-nombre"></div>
    <div class="listo-sub" id="listo-sub">Receta guardada</div>
    <button class="btn-primario" id="btn-compartir">📤 Compartir</button>
    <div class="msg" id="listo-msg"></div>
  </div>
</div>

<script>
  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  const codigo = new URLSearchParams(location.search).get('codigo');
  const cardCargando = document.getElementById('card-cargando');
  const cardError = document.getElementById('card-error');
  const cardPaciente = document.getElementById('card-paciente');
  const cardListo = document.getElementById('card-listo');

  let recetaData = null;
  let recetaGuardadaId = null;

  function mostrarError(texto) {
    cardCargando.classList.add('hidden');
    cardError.classList.remove('hidden');
    document.getElementById('error-texto').textContent = texto;
  }

  // Convención de MisRX/RCTA: "APELLIDO NOMBRE" (confirmado con el PDF de muestra real:
  // "VINZON FAUSTO" = apellido Vinzón, nombre Fausto).
  function splitNombreApellido(pacienteTexto) {
    const partes = String(pacienteTexto || '').trim().split(/\s+/);
    if (partes.length < 2) return { apellido: partes[0] || '', nombre: '' };
    return { apellido: partes[0], nombre: partes.slice(1).join(' ') };
  }

  async function cargar() {
    if (!codigo) { mostrarError('Falta el código de la receta en el link.'); return; }
    try {
      const r = await fetch(`/api/gestion/pacientes?modo=receta-proceso&codigo=${encodeURIComponent(codigo)}`);
      if (!r.ok) {
        const err = await r.json().catch(() => ({}));
        mostrarError(err.error || 'No se pudo cargar la receta.');
        return;
      }
      recetaData = await r.json();

      if (!recetaData.receta?.medicamentos?.length) {
        mostrarError('No pude leer ningún medicamento en el PDF — revisá que sea la receta correcta y volvé a intentar.');
        return;
      }

      // Sin revisión humana de los datos extraídos (confianza confirmada en la
      // extracción de texto, ver el pedido) — el único paso que puede seguir
      // requiriendo un toque es elegir el paciente correcto cuando hay más de un
      // candidato real: ahí sí conviene no adivinar, ver buscarCoincidenciasPaciente
      // en api/gestion/pacientes.js.
      const { matchAutomatico, candidatos } = recetaData;
      if (matchAutomatico) {
        await guardarYMostrarListo({ pacienteId: matchAutomatico.id, nombreCompleto: `${matchAutomatico.nombre} ${matchAutomatico.apellido}` });
      } else if (!candidatos || candidatos.length === 0) {
        const { nombre, apellido } = splitNombreApellido(recetaData.receta.paciente);
        await guardarYMostrarListo({ crearNuevo: { nombre, apellido, dni: recetaData.receta.dni || '' }, nombreCompleto: `${nombre} ${apellido}`.trim() });
      } else {
        mostrarPickerPaciente(candidatos);
      }
    } catch {
      mostrarError('No se pudo cargar la receta. Revisá tu conexión.');
    }
  }
  cargar();

  function mostrarPickerPaciente(candidatos) {
    cardCargando.classList.add('hidden');
    cardPaciente.classList.remove('hidden');
    const lista = document.getElementById('paciente-lista');
    lista.innerHTML = candidatos.map((c) => `
      <div class="resultado-row" data-id="${c.id}" data-nombre="${escapeHtml(c.nombre)} ${escapeHtml(c.apellido)}">
        <div><div class="nombre">${escapeHtml(c.nombre)} ${escapeHtml(c.apellido)}</div><div class="dni">DNI ${escapeHtml(c.dni || '—')}</div></div>
        <span>Elegir</span>
      </div>
    `).join('');
    lista.querySelectorAll('.resultado-row').forEach((el) => {
      el.addEventListener('click', () => {
        cardPaciente.classList.add('hidden');
        cardCargando.classList.remove('hidden');
        guardarYMostrarListo({ pacienteId: el.dataset.id, nombreCompleto: el.dataset.nombre });
      });
    });
  }

  async function guardarYMostrarListo({ pacienteId, crearNuevo, nombreCompleto }) {
    document.getElementById('cargando-texto').textContent = 'Guardando la receta...';
    try {
      const r = await fetch('/api/gestion/pacientes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          accion: 'receta-guardar',
          pacienteId: pacienteId || undefined,
          crearNuevo: crearNuevo || undefined,
          receta: recetaData.receta,
          codigoProceso: codigo,
        }),
      });
      const res = await r.json();
      if (!res.success) {
        mostrarError(res.message || 'No se pudo guardar la receta.');
        return;
      }
      recetaGuardadaId = res.id;
      cardCargando.classList.add('hidden');
      cardListo.classList.remove('hidden');
      document.getElementById('listo-nombre').textContent = nombreCompleto || 'Paciente';
      document.getElementById('listo-sub').textContent = res.fichaCreada && !res.fichaCreada.yaExistia
        ? 'Se creó una ficha nueva y se guardó la receta ahí.'
        : 'Receta guardada en la ficha del paciente.';
    } catch {
      mostrarError('No se pudo guardar la receta. Revisá tu conexión.');
    }
  }

  document.getElementById('btn-compartir').addEventListener('click', () => compartirRecetaGuardada());

  async function compartirRecetaGuardada() {
    if (!recetaGuardadaId) return;
    const nombreCompleto = document.getElementById('listo-nombre').textContent;
    const url = `/api/gestion/pacientes?modo=receta-pdf&recetaId=${recetaGuardadaId}`;
    const msg = document.getElementById('listo-msg');
    try {
      const resp = await fetch(url);
      const blob = await resp.blob();
      const file = new File([blob], `Receta${nombreCompleto ? ' - ' + nombreCompleto : ''}.pdf`, { type: 'application/pdf' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], text: `Receta${nombreCompleto ? ' — ' + nombreCompleto : ''}` });
        return;
      }
      const objectUrl = URL.createObjectURL(blob);
      window.open(objectUrl, '_blank');
    } catch {
      // AbortError = cerró el panel de compartir sin elegir nada, no es un error real
      msg.textContent = '';
    }
  }
</script>
</body>
</html>
