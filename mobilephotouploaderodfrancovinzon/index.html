<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fotos de pacientes | Franco Vinzón Odontólogo</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/isologo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1E3A5F; --gold: #D4A24C; --cream: #FAF9F6; --line: #E9E4D8;
    --white: #FFFFFF; --text: #2A2A2A; --muted: #8A8578; --bad: #C1443A; --ok: #4F9A3C;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  /* Letra grande en toda la página a propósito (Franco usa lupa, ver el pedido,
     2026-08-13) — base 18px en vez del 14px de siempre, y cada elemento de acá abajo
     escalado en la misma proporción. */
  body { background: var(--cream); color: var(--text); font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 18px; }
  h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; color: var(--navy); margin: 0; }
  .hidden { display: none !important; }
  button { font-family: inherit; cursor: pointer; }
  input, textarea { font-family: inherit; font-size: 18px; }

  #app { max-width: 480px; margin: 0 auto; padding: 20px 16px 60px; }
  .brand { text-align: center; margin-bottom: 18px; }
  .brand img { width: 220px; max-width: 70vw; height: auto; }
  .brand h1 { font-size: 23px; margin-top: 8px; }

  .card { background: var(--white); border-radius: 16px; padding: 18px; box-shadow: 0 1px 8px rgba(30,58,95,.06); margin-bottom: 16px; }
  .search-box { display: flex; gap: 8px; margin-bottom: 4px; }
  .search-box input { flex: 1; padding: 13px 14px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--cream); }
  .search-box input:focus { outline: none; border-color: var(--gold); background: var(--white); }
  .hint { color: var(--muted); font-size: 15.5px; margin-top: 8px; }

  .resultado-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 4px; border-bottom: 1px solid var(--line); gap: 10px; }
  .resultado-row:last-child { border-bottom: none; }
  .resultado-row .nombre { font-weight: 600; }
  .resultado-row .dni { color: var(--muted); font-size: 15px; margin-top: 2px; }
  .resultado-row button { background: var(--navy); color: var(--white); border: none; padding: 9px 16px; border-radius: 100px; font-size: 15.5px; font-weight: 600; flex-shrink: 0; }

  .hoy-titulo { font-size: 15.5px; text-transform: uppercase; letter-spacing: .3px; color: var(--muted); margin: 14px 0 4px; font-family: inherit; font-weight: 700; }

  .paciente-actual { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; }
  .paciente-actual .nombre { font-size: 22px; font-weight: 700; color: var(--navy); }
  /* Botón "Cambiar paciente" agrandado a propósito (ver el pedido) — antes era chico y
     poco visible; ahora tiene texto más grande y área táctil real (padding + fondo). */
  .btn-cambiar { background: var(--cream); border: 1.5px solid var(--line); color: var(--navy); font-size: 15.5px; font-weight: 600; padding: 10px 14px; border-radius: 10px; flex-shrink: 0; }

  .foto-input-label {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    border: 2px dashed var(--line); border-radius: 14px; padding: 28px 16px; text-align: center; color: var(--muted);
  }
  .foto-input-label span.icon { font-size: 32px; }
  .foto-input-label span.texto { font-size: 16.5px; }
  .foto-input-label input { display: none; }
  .preview-wrap { text-align: center; margin-bottom: 12px; }
  .preview-wrap img { max-width: 100%; max-height: 280px; border-radius: 12px; }
  .field { margin-top: 12px; }
  .field label { display: block; font-size: 15.5px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
  .field textarea { width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--cream); min-height: 60px; resize: vertical; }
  .field textarea:focus { outline: none; border-color: var(--gold); background: var(--white); }
  .btn-subir { width: 100%; margin-top: 14px; background: var(--gold); color: var(--white); border: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 18px; }
  .btn-subir:disabled { opacity: .55; }
  .msg { font-size: 15.5px; margin-top: 10px; min-height: 16px; }
  .msg.error { color: var(--bad); }
  .msg.ok { color: var(--ok); }

  .fotos-titulo { font-size: 18.5px; margin-top: 24px; margin-bottom: 12px; }
  .fotos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .foto-item { cursor: pointer; }
  .foto-item img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; display: block; }
  .foto-item .desc { font-size: 14.5px; color: var(--muted); margin-top: 4px; }
  .foto-item .fecha { font-size: 13px; color: var(--muted); }

  /* Visor a pantalla completa (ver el pedido) — se abre al tocar una foto de "Fotos ya
     subidas". Compartir con Web Share API (mismo patrón que "Guardar acceso a mi
     turno" en /turnos): si el navegador soporta compartir archivos, comparte la foto
     misma; si no, comparte/copia el link directo. */
  .visor-overlay {
    position: fixed; inset: 0; background: rgba(20,20,20,.94); z-index: 999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 18px; gap: 16px;
  }
  .visor-overlay img { max-width: 100%; max-height: 62vh; border-radius: 10px; object-fit: contain; }
  .visor-cerrar {
    position: absolute; top: 18px; right: 18px; background: rgba(255,255,255,.15); color: var(--white);
    border: none; width: 46px; height: 46px; border-radius: 50%; font-size: 20px; line-height: 1;
  }
  .visor-info { color: var(--white); text-align: center; max-width: 92%; font-size: 16.5px; }
  .visor-fecha { color: rgba(255,255,255,.62); font-size: 14.5px; margin-top: 4px; }
  .visor-compartir { background: var(--gold); color: var(--white); border: none; padding: 14px 28px; border-radius: 100px; font-weight: 700; font-size: 17px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(10px);
    background: var(--navy); color: var(--white); padding: 12px 22px; border-radius: 100px;
    font-size: 15.5px; opacity: 0; transition: opacity .2s ease, transform .2s ease; z-index: 1000; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="app">
  <div class="brand">
    <img src="../assets/logo-horizontal.png" alt="Franco Vinzón Odontólogo">
    <h1>Fotos de pacientes</h1>
  </div>

  <div class="card" id="card-buscar">
    <div class="search-box"><input type="text" id="buscar-input" placeholder="Buscar paciente por nombre o DNI..." autocomplete="off"></div>
    <div class="hint">Escribí al menos 2 caracteres.</div>
    <div id="resultados"></div>
    <div id="hoy-wrap" class="hidden">
      <div class="hoy-titulo">Pacientes de hoy</div>
      <div id="hoy-lista"></div>
    </div>
  </div>

  <div class="card hidden" id="card-paciente">
    <div class="paciente-actual">
      <div class="nombre" id="paciente-nombre"></div>
      <button class="btn-cambiar" id="btn-cambiar-paciente">Cambiar paciente</button>
    </div>

    <div id="preview-wrap" class="preview-wrap hidden"><img id="preview-img" alt=""></div>
    <label class="foto-input-label" id="foto-input-label">
      <span class="icon">📷</span>
      <span class="texto">Sacar o subir una foto</span>
      <input type="file" accept="image/*" capture="environment" id="foto-input">
    </label>

    <div class="field">
      <label>Descripción</label>
      <textarea id="foto-descripcion" placeholder="Ej: Radiografía panorámica, control de ortodoncia..."></textarea>
    </div>
    <button class="btn-subir" id="btn-subir" disabled>Subir foto</button>
    <div class="msg" id="upload-msg"></div>

    <h2 class="fotos-titulo">Fotos ya subidas</h2>
    <div class="fotos-grid" id="fotos-grid"></div>
    <div class="hint hidden" id="fotos-vacio">Todavía no hay fotos de este paciente.</div>
  </div>
</div>

<div class="visor-overlay hidden" id="visor-overlay">
  <button class="visor-cerrar" id="visor-cerrar" aria-label="Cerrar">✕</button>
  <img id="visor-img" alt="">
  <div class="visor-info">
    <div id="visor-desc"></div>
    <div class="visor-fecha" id="visor-fecha"></div>
  </div>
  <button class="visor-compartir" id="visor-compartir">📤 Compartir</button>
</div>

<script>
  const cardBuscar = document.getElementById('card-buscar');
  const cardPaciente = document.getElementById('card-paciente');
  const buscarInput = document.getElementById('buscar-input');
  const resultadosEl = document.getElementById('resultados');
  const hoyWrap = document.getElementById('hoy-wrap');
  const hoyListaEl = document.getElementById('hoy-lista');
  const pacienteNombreEl = document.getElementById('paciente-nombre');
  const fotoInput = document.getElementById('foto-input');
  const previewWrap = document.getElementById('preview-wrap');
  const previewImg = document.getElementById('preview-img');
  const fotoDescripcion = document.getElementById('foto-descripcion');
  const btnSubir = document.getElementById('btn-subir');
  const uploadMsg = document.getElementById('upload-msg');
  const fotosGrid = document.getElementById('fotos-grid');
  const fotosVacio = document.getElementById('fotos-vacio');
  const visorOverlay = document.getElementById('visor-overlay');
  const visorImg = document.getElementById('visor-img');
  const visorDesc = document.getElementById('visor-desc');
  const visorFecha = document.getElementById('visor-fecha');

  let pacienteActual = null;
  let fotoComprimidaBase64 = null;
  let pacientesHoy = [];
  let fotosActuales = [];

  function setMsg(texto, tipo) {
    uploadMsg.textContent = texto;
    uploadMsg.className = `msg ${tipo || ''}`;
  }

  let toastEl = null;
  function toast(texto) {
    if (!toastEl) {
      toastEl = document.createElement('div');
      toastEl.className = 'toast';
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = texto;
    requestAnimationFrame(() => toastEl.classList.add('show'));
    clearTimeout(toastEl._timer);
    toastEl._timer = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }

  // ---------- Pacientes de hoy ----------
  // Atajo para no tener que buscar a mano al paciente que ya está sentado en el
  // consultorio (ver el pedido, 2026-08-13) — mismo criterio que "Pacientes de hoy" de
  // /pacientes, pero resuelto server-side sin clave (modo=hoy-publico). Se pinta debajo
  // del buscador y se oculta apenas se escribe una búsqueda (para no competir con los
  // resultados de la búsqueda por texto).
  function renderHoyLista() {
    hoyListaEl.innerHTML = pacientesHoy.map((p) => `
      <div class="resultado-row">
        <div><div class="nombre">${escapeHtml(p.nombre)} ${escapeHtml(p.apellido)}</div><div class="dni">Turno ${escapeHtml(p.hora)}</div></div>
        <button type="button" data-id="${p.id}" data-nombre="${escapeHtml(p.nombre)} ${escapeHtml(p.apellido)}">Elegir</button>
      </div>
    `).join('');
    hoyListaEl.querySelectorAll('button[data-id]').forEach((btn) => {
      btn.addEventListener('click', () => elegirPaciente(btn.dataset.id, btn.dataset.nombre));
    });
  }

  async function cargarPacientesHoy() {
    try {
      const r = await fetch('/api/gestion/pacientes?modo=hoy-publico');
      const data = await r.json();
      pacientesHoy = Array.isArray(data) ? data : [];
      renderHoyLista();
      if (buscarInput.value.trim().length < 2) hoyWrap.classList.toggle('hidden', pacientesHoy.length === 0);
    } catch {
      // sin conexión: la sección queda oculta, se puede seguir buscando a mano arriba
    }
  }
  cargarPacientesHoy();

  // ---------- Buscar paciente ----------
  let buscarTimer = null;
  buscarInput.addEventListener('input', () => {
    clearTimeout(buscarTimer);
    const q = buscarInput.value.trim();
    if (q.length < 2) {
      resultadosEl.innerHTML = '';
      hoyWrap.classList.toggle('hidden', pacientesHoy.length === 0);
      return;
    }
    hoyWrap.classList.add('hidden');
    buscarTimer = setTimeout(() => buscarPacientes(q), 300);
  });

  async function buscarPacientes(q) {
    try {
      const r = await fetch(`/api/gestion/pacientes?modo=buscar-publico&q=${encodeURIComponent(q)}`);
      const resultados = await r.json();
      resultadosEl.innerHTML = resultados.map((p) => `
        <div class="resultado-row">
          <div><div class="nombre">${escapeHtml(p.nombre)} ${escapeHtml(p.apellido)}</div><div class="dni">DNI ${escapeHtml(p.dni || '—')}</div></div>
          <button type="button" data-id="${p.id}" data-nombre="${escapeHtml(p.nombre)} ${escapeHtml(p.apellido)}">Elegir</button>
        </div>
      `).join('') || '<p class="hint">Sin resultados.</p>';
      resultadosEl.querySelectorAll('button[data-id]').forEach((btn) => {
        btn.addEventListener('click', () => elegirPaciente(btn.dataset.id, btn.dataset.nombre));
      });
    } catch {
      resultadosEl.innerHTML = '<p class="hint">No se pudo buscar. Revisá tu conexión.</p>';
    }
  }

  function escapeHtml(str) {
    return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function elegirPaciente(id, nombre) {
    pacienteActual = { id, nombre };
    pacienteNombreEl.textContent = nombre;
    cardBuscar.classList.add('hidden');
    cardPaciente.classList.remove('hidden');
    resetFormFoto();
    cargarFotos();
  }
  document.getElementById('btn-cambiar-paciente').addEventListener('click', () => {
    pacienteActual = null;
    cardPaciente.classList.add('hidden');
    cardBuscar.classList.remove('hidden');
    buscarInput.value = '';
    resultadosEl.innerHTML = '';
    hoyWrap.classList.toggle('hidden', pacientesHoy.length === 0);
    buscarInput.focus();
  });

  // ---------- Comprimir y previsualizar foto ----------
  // Nunca se sube el archivo original de la cámara (varios MB) — se redibuja en un
  // canvas más chico y se re-codifica JPEG calidad .75, bien por debajo del límite
  // de 4.5MB del body de una función serverless de Vercel (ver decisions.md).
  const LADO_MAX = 1600;
  fotoInput.addEventListener('change', () => {
    const file = fotoInput.files[0];
    if (!file) return;
    setMsg('', '');
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => { img.src = e.target.result; };
    img.onload = () => {
      let { width, height } = img;
      if (width > LADO_MAX || height > LADO_MAX) {
        const escala = LADO_MAX / Math.max(width, height);
        width = Math.round(width * escala);
        height = Math.round(height * escala);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      fotoComprimidaBase64 = canvas.toDataURL('image/jpeg', 0.75);
      previewImg.src = fotoComprimidaBase64;
      previewWrap.classList.remove('hidden');
      btnSubir.disabled = false;
    };
    reader.readAsDataURL(file);
  });

  function resetFormFoto() {
    fotoInput.value = '';
    fotoComprimidaBase64 = null;
    fotoDescripcion.value = '';
    previewWrap.classList.add('hidden');
    btnSubir.disabled = true;
    setMsg('', '');
  }

  btnSubir.addEventListener('click', async () => {
    if (!pacienteActual || !fotoComprimidaBase64) return;
    btnSubir.disabled = true;
    btnSubir.textContent = 'Subiendo...';
    setMsg('', '');
    try {
      const r = await fetch('/api/gestion/pacientes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          accion: 'subir-foto',
          pacienteId: pacienteActual.id,
          fotoBase64: fotoComprimidaBase64,
          descripcion: fotoDescripcion.value.trim(),
        }),
      });
      const res = await r.json();
      if (res.success) {
        setMsg('✅ Foto subida.', 'ok');
        resetFormFoto();
        cargarFotos();
      } else {
        setMsg(res.message || 'No se pudo subir la foto.', 'error');
        btnSubir.disabled = false;
      }
    } catch {
      setMsg('No se pudo subir la foto. Revisá tu conexión.', 'error');
      btnSubir.disabled = false;
    } finally {
      btnSubir.textContent = 'Subir foto';
    }
  });

  // ---------- Fotos ya subidas ----------
  async function cargarFotos() {
    if (!pacienteActual) return;
    try {
      const r = await fetch(`/api/gestion/pacientes?modo=fotos&id=${pacienteActual.id}`);
      const fotos = await r.json();
      fotosActuales = fotos;
      fotosVacio.classList.toggle('hidden', fotos.length > 0);
      fotosGrid.innerHTML = fotos.map((f, i) => `
        <div class="foto-item" data-idx="${i}">
          <img src="/api/gestion/pacientes?modo=foto-imagen&fotoId=${f.id}" alt="" loading="lazy">
          ${f.descripcion ? `<div class="desc">${escapeHtml(f.descripcion)}</div>` : ''}
          <div class="fecha">${new Date(f.fecha).toLocaleDateString('es-AR')}</div>
        </div>
      `).join('');
      fotosGrid.querySelectorAll('.foto-item').forEach((el) => {
        el.addEventListener('click', () => abrirVisor(parseInt(el.dataset.idx, 10)));
      });
    } catch {
      // sin conexión: se queda con lo que ya había, no rompe la pantalla
    }
  }

  // ---------- Visor a pantalla completa + compartir ----------
  function abrirVisor(idx) {
    const f = fotosActuales[idx];
    if (!f) return;
    const url = `/api/gestion/pacientes?modo=foto-imagen&fotoId=${f.id}`;
    visorImg.src = url;
    visorDesc.textContent = f.descripcion || '';
    visorFecha.textContent = new Date(f.fecha).toLocaleDateString('es-AR');
    visorOverlay.dataset.url = url;
    visorOverlay.classList.remove('hidden');
  }
  function cerrarVisor() {
    visorOverlay.classList.add('hidden');
    visorImg.src = '';
  }
  document.getElementById('visor-cerrar').addEventListener('click', cerrarVisor);
  visorOverlay.addEventListener('click', (e) => { if (e.target === visorOverlay) cerrarVisor(); });

  // Web Share API — si el navegador soporta compartir archivos (canShare con files),
  // comparte la foto misma; si solo soporta compartir links (o nada), cae a compartir/
  // copiar el link directo. Mismo espíritu que "Guardar acceso a mi turno" en /turnos:
  // nunca se fuerza una sola vía, se usa lo mejor disponible en cada navegador.
  document.getElementById('visor-compartir').addEventListener('click', async () => {
    const url = visorOverlay.dataset.url;
    if (!url) return;
    try {
      if (navigator.canShare) {
        const resp = await fetch(url);
        const blob = await resp.blob();
        const file = new File([blob], 'foto-paciente.jpg', { type: blob.type || 'image/jpeg' });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: 'Foto de paciente' });
          return;
        }
      }
      if (typeof navigator.share === 'function') {
        await navigator.share({ title: 'Foto de paciente', url });
        return;
      }
      await navigator.clipboard.writeText(location.origin + url);
      toast('Link copiado ✓');
    } catch (err) {
      // AbortError = cerró el panel de compartir sin elegir nada, no es un error real
    }
  });
</script>
</body>
</html>
